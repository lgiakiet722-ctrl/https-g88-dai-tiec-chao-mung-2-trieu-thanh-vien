<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Thanh toán</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
}

.payment-card {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 15px;
}

h2 {
    margin-top: 0;
}

.amount-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 20px 0;
}

.amount-list button {
    padding: 12px 18px;
    border: 0;
    border-radius: 8px;
    background: #0bbf6f;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

.amount-list button:hover {
    background: #099e5d;
}

#qrImage {
    display: block;
    width: 300px;
    height: 300px;
    object-fit: contain;
    margin: 20px auto;
}

.info {
    text-align: center;
}

.amount {
    color: red;
    font-size: 25px;
    font-weight: bold;
}

.note {
    margin-top: 15px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="payment-card">

    <h2>Thanh toán chuyển khoản</h2>

    <p>Chọn số tiền:</p>

    <div class="amount-list">
        <button onclick="changeAmount(50000)">50.000đ</button>
        <button onclick="changeAmount(100000)">100.000đ</button>
        <button onclick="changeAmount(200000)">200.000đ</button>
        <button onclick="changeAmount(300000)">300.000đ</button>
        <button onclick="changeAmount(500000)">500.000đ</button>
        <button onclick="changeAmount(1000000)">1.000.000đ</button>
    </div>

    <div class="info">

        <p>Số tiền thanh toán:</p>

        <div id="amountText" class="amount">
            300.000 VND
        </div>

        <!-- QR được tạo trực tiếp từ VietQR -->
        <img
            id="qrImage"
            src=""
            alt="Mã QR thanh toán"
        >

        <div class="note">
            Nội dung chuyển khoản:
            <span id="transferContent"></span>
        </div>

    </div>

</div>

<script>

/*
    THAY 3 THÔNG TIN NÀY BẰNG
    THÔNG TIN TÀI KHOẢN CỦA WEBSITE HỢP PHÁP CỦA BẠN
*/

const BANK_ID = "YOUR_BANK";
const ACCOUNT_NUMBER = "YOUR_ACCOUNT";
const ACCOUNT_NAME = "YOUR ACCOUNT NAME";


let currentAmount = 300000;


/*
    Tạo mã QR
*/
function updateQR() {

    const content = "THANHTOAN";

    const qrUrl =
        "https://img.vietqr.io/image/" +
        BANK_ID +
        "-" +
        ACCOUNT_NUMBER +
        "-compact2.png" +
        "?amount=" + currentAmount +
        "&addInfo=" + encodeURIComponent(content) +
        "&accountName=" + encodeURIComponent(ACCOUNT_NAME);

    document.getElementById("qrImage").src = qrUrl;

    document.getElementById("amountText").innerText =
        currentAmount.toLocaleString("vi-VN") + " VND";

    document.getElementById("transferContent").innerText =
        content;
}


/*
    Khi chọn mệnh giá
*/
function changeAmount(amount) {

    currentAmount = amount;

    updateQR();
}


/*
    Hiển thị QR mặc định
*/
updateQR();

</script>

</body>
</html>

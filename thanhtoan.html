<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>Đại Tiệc Chào Mừng 2 Triệu Thành Viên</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(
        to bottom,
        #033d3b 0px,
        #08786f 380px,
        #08786f 100%
    );
    color: white;
    overflow-x: hidden;
}

/* =========================
   KHUNG CHÍNH
========================= */

.page {
    width: 100%;
    min-height: 100vh;
    padding: 35px 20px 60px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

.container {
    width: 100%;
    max-width: 1050px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    gap: 55px;
}

/* =========================
   KHU VỰC LOGO
========================= */

.left {
    width: 45%;
    min-height: 600px;

    display: flex;
    justify-content: center;
    align-items: center;
}

.logo-box {
    width: 100%;
    max-width: 560px;

    display: flex;
    justify-content: center;
    align-items: center;
}

.logo {
    display: block;

    width: 100%;
    max-width: 560px;
    height: auto;

    object-fit: contain;

    /* Không để nền trắng của ảnh che background */
    mix-blend-mode: normal;
}

/* =========================
   FORM
========================= */

.right {
    width: 480px;
    flex-shrink: 0;
}

.card {
    width: 100%;

    border: 2px solid #f7bd00;
    border-radius: 18px;

    padding: 35px 45px 32px;

    background: rgba(8, 120, 111, 0.55);
}

/* =========================
   TIÊU ĐỀ
========================= */

.event {
    width: 100%;
    min-height: 62px;

    display: flex;
    justify-content: center;
    align-items: center;

    text-align: center;

    border: 2px solid #f7bd00;
    border-radius: 40px;

    padding: 10px 20px;

    color: #ffd21a;

    font-size: 22px;
    line-height: 1.25;
    font-weight: bold;

    margin-bottom: 35px;
}

/* =========================
   LABEL
========================= */

.label {
    display: block;

    text-align: center;

    color: #ffd21a;

    font-size: 18px;
    font-weight: bold;

    margin-bottom: 10px;
}

/* =========================
   INPUT
========================= */

.username {
    width: 100%;
    height: 62px;

    border: 2px solid #f7bd00;
    border-radius: 40px;

    background: white;
    color: #222;

    font-size: 18px;

    text-align: center;

    padding: 0 20px;

    outline: none;

    margin-bottom: 18px;
}

.username::placeholder {
    color: #999;
}

.username:focus {
    border-color: #ffd21a;
}

/* =========================
   THÔNG BÁO
========================= */

.message {
    width: 100%;
    min-height: 60px;

    display: flex;
    align-items: center;

    background: white;
    color: #333;

    border-radius: 5px;

    padding: 12px 16px;

    margin-bottom: 28px;

    font-size: 18px;
}

.message-icon {
    width: 38px;
    height: 38px;

    flex-shrink: 0;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 50%;

    background: #2fb65d;
    color: white;

    font-size: 25px;
    font-weight: bold;
}

.message-text {
    margin-left: 12px;
}

/* =========================
   BUTTON
========================= */

.check {
    display: block;

    min-width: 275px;
    height: 65px;

    margin: 0 auto 25px;

    padding: 0 30px;

    border: 2px solid white;
    border-radius: 40px;

    background: #1eb7c5;
    color: white;

    font-size: 21px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 4px 10px rgba(0,0,0,.25);

    transition:
        transform .15s ease,
        opacity .15s ease;
}

.check:hover {
    transform: translateY(-2px);
}

.check:active {
    transform: translateY(1px);
}

/* =========================
   LINKS
========================= */

.links {
    width: 100%;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 25px;

    margin-top: 5px;
}

.links a {
    color: #ffd21a;

    font-size: 15px;
    font-weight: bold;

    text-decoration: none;

    white-space: nowrap;
}

.links a:hover {
    text-decoration: underline;
}

/* =========================
   SOCIAL
========================= */

.follow {
    margin-top: 22px;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 10px;

    color: white;

    font-size: 15px;
    font-weight: bold;
}

.social {
    width: 34px;
    height: 34px;

    display: inline-flex;
    justify-content: center;
    align-items: center;

    border-radius: 50%;

    background: #159ee0;

    color: white;

    text-decoration: none;

    font-size: 16px;
    font-weight: bold;
}

/* =========================
   TABLET
========================= */

@media (max-width: 850px) {

    .page {
        padding: 20px 15px 50px;
    }

    .container {
        flex-direction: column;
        align-items: center;
        gap: 20px;
    }

    .left {
        width: 100%;
        min-height: auto;
    }

    .logo-box {
        max-width: 500px;
    }

    .logo {
        max-width: 500px;
    }

    .right {
        width: 100%;
        max-width: 500px;
    }

    .card {
        padding: 30px 28px;
    }
}

/* =========================
   ĐIỆN THOẠI
========================= */

@media (max-width: 500px) {

    body {
        background: linear-gradient(
            to bottom,
            #033d3b 0px,
            #08786f 180px,
            #08786f 100%
        );
    }

    .page {
        padding: 15px 12px 45px;
    }

    .container {
        gap: 8px;
    }

    /* Logo trên điện thoại */
    .left {
        width: 100%;
        min-height: auto;

        padding: 0 5px;
    }

    .logo-box {
        width: 100%;
        max-width: 390px;
    }

    .logo {
        width: 100%;
        max-width: 390px;
        height: auto;
    }

    .right {
        width: 100%;
    }

    .card {
        width: 100%;

        padding: 30px 20px 28px;

        border-radius: 0;

        border-left: 2px solid #f7bd00;
        border-right: 2px solid #f7bd00;
    }

    .event {
        min-height: 62px;

        font-size: 21px;

        padding: 10px 18px;

        margin-bottom: 42px;
    }

    .label {
        font-size: 19px;

        margin-bottom: 15px;
    }

    .username {
        height: 62px;

        font-size: 18px;

        margin-bottom: 22px;
    }

    .message {
        min-height: 60px;

        padding: 12px 16px;

        margin-bottom: 28px;

        font-size: 18px;
    }

    .message-icon {
        width: 42px;
        height: 42px;
    }

    .check {
        width: 90%;
        min-width: 0;

        height: 65px;

        font-size: 21px;

        margin-bottom: 30px;
    }

    .links {
        gap: 22px;
    }

    .links a {
        font-size: 15px;
    }

    .follow {
        margin-top: 25px;
        padding-bottom: 5px;
    }
}

/* =========================
   ĐIỆN THOẠI RẤT NHỎ
========================= */

@media (max-width: 360px) {

    .card {
        padding-left: 15px;
        padding-right: 15px;
    }

    .event {
        font-size: 18px;
    }

    .username {
        font-size: 16px;
    }

    .check {
        font-size: 18px;
    }

    .links {
        gap: 12px;
    }

    .links a {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="container">

        <!-- =====================
             LOGO
        ====================== -->

        <div class="left">

            <div class="logo-box">

                <img
                    class="logo"
                    src="4387413a-ea82-4d2e-8f1b-b04ddb2ec70b1.png"
                    alt="Đại tiệc chào mừng 2 triệu thành viên"
                >

            </div>

        </div>


        <!-- =====================
             FORM
        ====================== -->

        <div class="right">

            <div class="card">

                <!-- TIÊU ĐỀ -->

                <div class="event">
                    ĐẠI TIỆC THÁNG 8 KM 20% GIÁ TRỊ!
                </div>


                <!-- LABEL -->

                <label
                    class="label"
                    for="username"
                >
                    Tên tài khoản:
                </label>


                <!-- INPUT -->

                <input
                    type="text"
                    id="username"
                    class="username"
                    placeholder="Nhập tên người dùng"
                    autocomplete="off"
                >


                <!-- THÔNG BÁO -->

                <div class="message">

                    <span class="message-icon">
                        ✓
                    </span>

                    <span class="message-text">
                        Đã xác thực
                    </span>

                </div>


                <!-- BUTTON -->

                <button
                    type="button"
                    class="check"
                    onclick="kiemTra()"
                >
                    KIỂM TRA NGAY
                </button>


                <!-- LINK -->

                <div class="links">

                    <a href="#">
                        Thông tin chương trình &gt;
                    </a>

                    <a href="#">
                        Trang phát code &gt;
                    </a>

                </div>


                <!-- SOCIAL -->

                <div class="follow">

                    <span>
                        Theo dõi thêm:
                    </span>

                    <a
                        class="social"
                        href="#"
                        title="Telegram"
                    >
                        ➤
                    </a>

                    <a
                        class="social"
                        href="#"
                        title="Facebook"
                    >
                        f
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

function kiemTra() {

    const username =
        document
        .getElementById("username")
        .value
        .trim();

    if (username === "") {

        alert("Vui lòng nhập tên người dùng!");

        document
        .getElementById("username")
        .focus();

        return;
    }

    /*
       Lưu tên tài khoản nếu trang thanhtoan.html
       cần sử dụng lại.
    */

    localStorage.setItem(
        "username",
        username
    );

    /*
       Chuyển sang thanhtoan.html
       Hai file phải nằm cùng thư mục.
    */

    window.location.href = "thanhtoan.html";
}

</script>

</body>
</html>

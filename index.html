<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đại Tiệc Chào Mừng 2 Triệu Thành Viên</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial;background:radial-gradient(circle,#117d73,#08635c 50%,#033e3a);min-height:100vh;color:white}.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:25px}.wrap{width:min(1100px,100%);display:grid;grid-template-columns:1fr 430px;gap:70px;align-items:center}.left{text-align:center}.left h1{color:#ffd43b;font-size:58px;line-height:1.05;text-shadow:0 5px 8px #0006}.left p{margin-top:20px;font-weight:bold}.card{border:2px solid #ffc400;border-radius:20px;padding:25px;text-align:center;background:#05696255}.logo{width:230px;max-width:100%;margin:0 auto 18px;display:block}.event{border:2px solid #ffc400;border-radius:30px;padding:12px;color:#ffd43b;font-weight:900;margin-bottom:22px}.label{color:#ffd43b;font-weight:bold;margin-bottom:8px}input{width:100%;height:50px;border:2px solid #ffc400;border-radius:28px;text-align:center;font-size:16px;outline:0}.error{height:24px;margin-top:8px;color:#ffd43b;font-weight:bold;font-size:14px}.btn{border:2px solid white;border-radius:30px;padding:13px 28px;background:#16c4c8;color:white;font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 6px 12px #0005}.btn:hover{filter:brightness(1.08);transform:translateY(-2px)}@media(max-width:800px){.wrap{grid-template-columns:1fr;gap:30px}.left h1{font-size:40px}}
</style>
</head>
<body>
<div class="page"><div class="wrap">
<div class="left"><h1>ĐẠI TIỆC<br>CHÀO MỪNG</h1><p>Chương trình đặc biệt dành cho thành viên</p></div>
<div class="card">
<img src="logo.png" class="logo" alt="Logo" onerror="this.style.display='none'">
<div class="event">ĐẠI TIỆC THÁNG 8 KM 20% GIÁ TRỊ!</div>
<div class="label">Tên tài khoản:</div>
<input id="username" placeholder="Nhập tên người dùng" autocomplete="off">
<div class="error" id="error"></div>
<button class="btn" onclick="kiemTra()">KIỂM TRA NGAY</button>
</div></div></div>
<script>
function kiemTra(){
 const u=document.getElementById('username').value.trim();
 if(!u){document.getElementById('error').textContent='Vui lòng nhập tên người dùng!';return}
 localStorage.setItem('username',u);
 location.href='thanhtoan.html';
}
document.getElementById('username').addEventListener('keydown',e=>{if(e.key==='Enter')kiemTra()});
</script>
</body>
</html>

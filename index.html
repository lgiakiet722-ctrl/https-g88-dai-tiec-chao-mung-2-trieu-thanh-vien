<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Đại tiệc chào mừng 2 triệu thành viên</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #087b72;
            color: #ffd21c;
            overflow-x: hidden;
        }

        /* =========================
           KHUNG CHÍNH
        ========================= */

        .page {
            width: 100%;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 35px 20px;
        }

        .container {
            width: 100%;
            max-width: 1050px;

            display: flex;
            align-items: center;
            justify-content: center;
            gap: 45px;
        }

        /* =========================
           LOGO
        ========================= */

        .logo-area {
            width: 48%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo {
            display: block;
            width: 100%;
            max-width: 520px;
            height: auto;
            object-fit: contain;
        }

        /* Nếu logo không tải được */
        .logo-fallback {
            display: none;

            width: 100%;
            max-width: 520px;

            text-align: center;
            font-weight: 900;
            line-height: 1.05;

            color: #ffd21c;

            text-shadow:
                2px 2px 0 #b40000,
                4px 4px 0 #ff5a00,
                0 0 15px rgba(255, 210, 28, 0.8);
        }

        .logo-fallback .small {
            font-size: 32px;
            display: block;
        }

        .logo-fallback .number {
            font-size: 100px;
            display: block;
        }

        .logo-fallback .member {
            font-size: 35px;
            display: block;
        }

        /* =========================
           CARD
        ========================= */

        .card {
            width: 100%;
            max-width: 520px;

            border: 3px solid #f5c400;
            border-radius: 0;

            padding: 38px 40px 35px;

            background: #087b72;

            box-shadow:
                0 0 25px rgba(0, 0, 0, 0.12);
        }

        /* =========================
           TIÊU ĐỀ SỰ KIỆN
        ========================= */

        .event {
            width: 100%;

            min-height: 100px;

            display: flex;
            align-items: center;
            justify-content: center;

            text-align: center;

            border: 3px solid #f5c400;
            border-radius: 60px;

            padding: 18px 20px;

            color: #ffd21c;

            font-size: 27px;
            font-weight: 900;
            line-height: 1.15;

            margin-bottom: 55px;
        }

        /* =========================
           LABEL
        ========================= */

        .label {
            display: block;

            text-align: center;

            color: #ffd21c;

            font-size: 25px;
            font-weight: 800;

            margin-bottom: 16px;
        }

        /* =========================
           INPUT
        ========================= */

        .username {
            width: 100%;
            height: 64px;

            border: 3px solid #f5c400;
            border-radius: 50px;

            background: #ffffff;

            padding: 0 25px;

            text-align: center;

            color: #333;

            font-size: 20px;
            font-weight: 600;

            outline: none;

            margin-bottom: 25px;
        }

        .username::placeholder {
            color: #999;
            opacity: 1;
        }

        .username:focus {
            border-color: #ffd21c;

            box-shadow:
                0 0 0 3px rgba(255, 210, 28, 0.15);
        }

        /* =========================
           THÔNG BÁO
        ========================= */

        .message {
            width: 100%;

            display: none;
            align-items: center;

            min-height: 58px;

            background: #ffffff;

            border-radius: 6px;

            color: #333;

            font-size: 18px;

            padding: 10px 15px;

            margin-bottom: 25px;
        }

        .message.show {
            display: flex;
        }

        .check-icon {
            width: 38px;
            height: 38px;

            flex: 0 0 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #25b864;

            color: white;

            font-size: 25px;
            font-weight: 900;

            margin-right: 12px;
        }

        /* =========================
           NÚT KIỂM TRA
        ========================= */

        .check {
            width: 100%;
            height: 70px;

            border: 3px solid #ffffff;
            border-radius: 50px;

            background: #25b5c5;

            color: #ffffff;

            font-size: 25px;
            font-weight: 900;

            cursor: pointer;

            box-shadow:
                0 5px 10px rgba(0, 0, 0, 0.25);

            transition:
                transform 0.15s ease,
                opacity 0.15s ease;
        }

        .check:hover {
            transform: translateY(-2px);
        }

        .check:active {
            transform: scale(0.98);
        }

        .check:disabled {
            opacity: 0.7;
            cursor: default;
        }

        /* =========================
           LINKS
        ========================= */

        .links {
            width: 100%;

            display: flex;
            justify-content: space-between;
            align-items: center;

            gap: 20px;

            margin-top: 35px;
        }

        .links a {
            color: #ffd21c;

            text-decoration: none;

            font-size: 18px;
            font-weight: 800;

            white-space: nowrap;
        }

        .links a:hover {
            text-decoration: underline;
        }

        /* =========================
           THEO DÕI
        ========================= */

        .follow {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 12px;

            margin-top: 28px;

            color: #ffffff;

            font-size: 18px;
            font-weight: 700;
        }

        .social {
            width: 46px;
            height: 46px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            color: #ffffff;

            text-decoration: none;

            font-size: 20px;
            font-weight: 900;
        }

        .telegram {
            background: #229ed9;
        }

        .facebook {
            background: #1877f2;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {

            body {
                background: #087b72;
            }

            .page {
                min-height: 100vh;

                display: block;

                padding: 25px 0 45px;
            }

            .container {
                width: 100%;

                display: flex;
                flex-direction: column;

                gap: 10px;
            }

            /* LOGO TRÊN FORM */

            .logo-area {
                width: 100%;

                padding: 0 20px;

                min-height: 175px;

                display: flex;
                justify-content: center;
                align-items: center;
            }

            .logo {
                width: 100%;
                max-width: 470px;
                max-height: 190px;

                object-fit: contain;
            }

            .logo-fallback {
                max-width: 350px;
            }

            .logo-fallback .small {
                font-size: 24px;
            }

            .logo-fallback .number {
                font-size: 75px;
            }

            .logo-fallback .member {
                font-size: 27px;
            }

            /* FORM */

            .card {
                width: calc(100% - 28px);
                max-width: none;

                padding: 38px 25px 32px;

                border-width: 2px;
            }

            .event {
                min-height: 82px;

                border-width: 2px;

                font-size: 22px;

                padding: 15px 16px;

                margin-bottom: 40px;
            }

            .label {
                font-size: 22px;

                margin-bottom: 14px;
            }

            .username {
                height: 62px;

                font-size: 19px;

                margin-bottom: 25px;
            }

            .message {
                min-height: 60px;

                font-size: 17px;

                margin-bottom: 25px;
            }

            .check {
                height: 64px;

                font-size: 22px;
            }

            .links {
                margin-top: 32px;

                gap: 12px;
            }

            .links a {
                font-size: 16px;
            }

            .follow {
                margin-top: 25px;

                font-size: 17px;
            }

            .social {
                width: 44px;
                height: 44px;
            }
        }

        /* =========================
           IPHONE NHỎ
        ========================= */

        @media (max-width: 390px) {

            .page {
                padding-top: 15px;
            }

            .logo-area {
                min-height: 150px;
                padding: 0 15px;
            }

            .logo {
                max-height: 155px;
            }

            .card {
                width: calc(100% - 20px);

                padding: 30px 18px 28px;
            }

            .event {
                font-size: 19px;
                min-height: 75px;
            }

            .label {
                font-size: 20px;
            }

            .username {
                height: 58px;
                font-size: 17px;
            }

            .check {
                height: 60px;
                font-size: 20px;
            }

            .links a {
                font-size: 14px;
            }

            .follow {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="container">

            <!-- =========================
                 LOGO
            ========================== -->

            <div class="logo-area">

                <img
                    id="logo"
                    class="logo"
                    src="./4387413a-ea82-4d2e-8f1b-b04ddb2ec70b1.png"
                    alt="Đại tiệc chào mừng 2 triệu thành viên"
                >

                <!-- Hiện khi logo bị lỗi -->
                <div id="logoFallback" class="logo-fallback">
                    <span class="small">ĐẠI TIỆC CHÀO MỪNG</span>
                    <span class="number">2</span>
                    <span class="member">TRIỆU THÀNH VIÊN</span>
                </div>

            </div>


            <!-- =========================
                 FORM
            ========================== -->

            <section class="card">

                <!-- TIÊU ĐỀ -->

                <div class="event">
                    ĐẠI TIỆC THÁNG 8 KM 20% GIÁ TRỊ!
                </div>


                <!-- TÊN TÀI KHOẢN -->

                <label
                    class="label"
                    for="username"
                >
                    Tên tài khoản:
                </label>


                <!-- INPUT -->

                <input
                    id="username"
                    class="username"
                    type="text"
                    placeholder="Nhập tên người dùng"
                    autocomplete="off"
                    autocapitalize="none"
                    spellcheck="false"
                >


                <!-- THÔNG BÁO XÁC THỰC -->

                <div
                    id="message"
                    class="message"
                    role="status"
                    aria-live="polite"
                >
                    <span class="check-icon">✓</span>

                    <span id="messageText">
                        Đã xác thực
                    </span>
                </div>


                <!-- NÚT KIỂM TRA -->

                <button
                    id="checkButton"
                    class="check"
                    type="button"
                >
                    KIỂM TRA NGAY
                </button>


                <!-- LINK -->

                <div class="links">

                    <a href="#">
                        Thông tin chương trình &gt;
                    </a>

                    <!-- QUAN TRỌNG:
                         dùng đường dẫn tương đối -->
                    <a href="./thanhtoan.html">
                        Trang phát code &gt;
                    </a>

                </div>


                <!-- THEO DÕI -->

                <div class="follow">

                    <span>Theo dõi thêm:</span>

                    <a
                        class="social telegram"
                        href="#"
                        aria-label="Telegram"
                    >
                        ➤
                    </a>

                    <a
                        class="social facebook"
                        href="#"
                        aria-label="Facebook"
                    >
                        f
                    </a>

                </div>

            </section>

        </div>

    </main>


    <script>

        /*
         * ==========================================
         * XỬ LÝ LOGO
         * ==========================================
         */

        const logo = document.getElementById("logo");
        const logoFallback = document.getElementById("logoFallback");

        function showLogoError() {

            if (logo) {
                logo.style.display = "none";
            }

            if (logoFallback) {
                logoFallback.style.display = "block";
            }
        }

        logo.addEventListener("error", showLogoError);


        /*
         * ==========================================
         * KIỂM TRA NGƯỜI DÙNG
         * ==========================================
         */

        const usernameInput =
            document.getElementById("username");

        const checkButton =
            document.getElementById("checkButton");

        const message =
            document.getElementById("message");

        const messageText =
            document.getElementById("messageText");


        checkButton.addEventListener("click", function () {

            const username =
                usernameInput.value.trim();


            /*
             * Không nhập tên
             */

            if (username === "") {

                alert("Vui lòng nhập tên người dùng!");

                usernameInput.focus();

                return;
            }


            /*
             * Hiện trạng thái xác thực
             */

            messageText.textContent = "Đã xác thực";

            message.classList.add("show");


            /*
             * Khóa nút trong lúc chuyển trang
             */

            checkButton.disabled = true;

            checkButton.textContent = "ĐÃ XÁC THỰC";


            /*
             * Chuyển sang thanhtoan.html
             *
             * Dùng đường dẫn tương đối.
             * Không dùng https://
             * Không dùng domain cố định.
             */

            setTimeout(function () {

                window.location.href = "./thanhtoan.html";

            }, 500);

        });


        /*
         * ==========================================
         * CHO PHÉP NHẤN ENTER ĐỂ KIỂM TRA
         * ==========================================
         */

        usernameInput.addEventListener("keydown", function (event) {

            if (event.key === "Enter") {

                event.preventDefault();

                checkButton.click();

            }

        });

    </script>

</body>
</html>

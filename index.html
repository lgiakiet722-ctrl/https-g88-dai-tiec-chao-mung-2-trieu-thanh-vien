<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <!-- Tối ưu điện thoại -->
    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Đại Tiệc Chào Mừng 2 Triệu Thành Viên</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #08766d;
            color: #ffd94d;
            overflow-x: hidden;
        }

        /* =========================
           KHUNG TRANG
        ========================= */

        .page {
            width: 100%;
            min-height: 100vh;
            background:
                linear-gradient(
                    to bottom,
                    #03443f 0px,
                    #075d56 240px,
                    #117d72 240px,
                    #117d72 100%
                );
        }

        /* =========================
           ĐƯỜNG VIỀN
        ========================= */

        .gold-line {
            width: 100%;
            height: 3px;

            background: #f2c735;

            box-shadow:
                0 0 5px rgba(255, 225, 80, 0.5);
        }

        /* =========================
           LOGO
        ========================= */

        .logo-area {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 15px 12px;
        }

        .logo {
            display: block;

            width: min(760px, 92vw);

            height: auto;

            object-fit: contain;

            filter:
                drop-shadow(0 5px 8px rgba(0,0,0,0.3));
        }

        /* =========================
           NỘI DUNG CHÍNH
        ========================= */

        .main {
            width: 100%;

            display: flex;
            flex-direction: column;
            align-items: center;

            padding-top: 85px;
            padding-bottom: 60px;
        }

        /* =========================
           TIÊU ĐỀ CHƯƠNG TRÌNH
        ========================= */

        .event-title {
            width: min(620px, 90vw);

            min-height: 55px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 8px 20px;

            border: 3px solid #f2c735;

            border-radius: 40px;

            color: #ffd94d;

            font-size: 25px;
            font-weight: 800;

            text-align: center;

            text-shadow:
                0 2px 2px rgba(0,0,0,0.25);

            box-shadow:
                0 3px 5px rgba(0,0,0,0.2),
                inset 0 0 5px rgba(255,255,255,0.08);

            margin-bottom: 36px;
        }

        /* =========================
           LABEL
        ========================= */

        .label {
            color: #ffdf5b;

            font-size: 20px;

            font-weight: 700;

            margin-bottom: 12px;
        }

        /* =========================
           INPUT
        ========================= */

        .input-box {
            width: min(620px, 90vw);

            height: 60px;

            border: 3px solid #e8bd34;

            border-radius: 40px;

            background: white;

            box-shadow:
                0 3px 6px rgba(0,0,0,0.25);

            overflow: hidden;

            margin-bottom: 24px;
        }

        .input-box input {
            width: 100%;
            height: 100%;

            border: none;
            outline: none;

            background: transparent;

            text-align: center;

            padding: 0 20px;

            font-size: 18px;

            color: #555;
        }

        .input-box input::placeholder {
            color: #999;
        }

        /* =========================
           KHUNG XÁC NHẬN
        ========================= */

        .verify-box {
            width: min(650px, 92vw);

            min-height: 55px;

            display: flex;
            align-items: center;

            background: #ffffff;

            color: #444;

            padding: 10px 18px;

            margin-bottom: 30px;

            box-shadow:
                0 3px 7px rgba(0,0,0,0.18);
        }

        .verify-left {
            display: flex;
            align-items: center;

            gap: 12px;
        }

        .verify-check {
            width: 28px;
            height: 28px;

            border-radius: 50%;

            background: #2db45d;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;
            font-weight: bold;
        }

        .verify-text {
            font-size: 15px;
        }

        .verify-right {
            margin-left: auto;

            text-align: right;
        }

        .verify-right strong {
            display: block;

            color: #ef8a32;

            font-size: 14px;
        }

        .verify-right span {
            display: block;

            color: #777;

            font-size: 10px;
        }

        /* =========================
           NÚT KIỂM TRA
        ========================= */

        .check-button {
            min-width: 245px;

            height: 60px;

            padding: 0 30px;

            border-radius: 40px;

            border: 3px solid #dffffa;

            background:
                linear-gradient(
                    to bottom,
                    #29c8be,
                    #0ba69c
                );

            color: white;

            font-size: 21px;

            font-weight: 900;

            cursor: pointer;

            box-shadow:
                0 4px 7px rgba(0,0,0,0.3),
                inset 0 1px 1px rgba(255,255,255,0.5);

            transition: 0.15s;
        }

        .check-button:hover {
            transform: translateY(-1px);

            filter: brightness(1.08);
        }

        .check-button:active {
            transform: translateY(2px);
        }

        /* =========================
           THÔNG BÁO
        ========================= */

        .message {
            min-height: 25px;

            margin-top: 15px;

            font-size: 15px;

            font-weight: bold;

            text-align: center;
        }

        .message.success {
            color: #d8ff8a;
        }

        .message.error {
            color: #ffd09e;
        }

        /* =========================
           LINK
        ========================= */

        .links {
            display: flex;

            justify-content: center;

            gap: 45px;

            margin-top: 20px;

            flex-wrap: wrap;
        }

        .links a {
            color: #ffe05a;

            text-decoration: none;

            font-size: 16px;

            font-weight: 800;
        }

        .links a:hover {
            text-decoration: underline;
        }

        /* =========================
           THEO DÕI
        ========================= */

        .follow {
            display: flex;

            align-items: center;

            justify-content: center;

            gap: 12px;

            margin-top: 26px;

            color: #ffe05a;

            font-size: 16px;

            font-weight: 800;
        }

        .social {
            width: 34px;
            height: 34px;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            color: white;

            text-decoration: none;

            font-weight: bold;

            font-size: 18px;
        }

        .telegram {
            background: #32aeea;
        }

        .facebook {
            background: #1877f2;
        }

        /* =========================
           FOOTER
        ========================= */

        .bottom-area {
            width: 100%;

            min-height: 110px;

            background:
                linear-gradient(
                    to bottom,
                    #117d72,
                    #075b55
                );
        }

        /* =========================
           ĐIỆN THOẠI
        ========================= */

        @media (max-width: 600px) {

            .logo-area {
                padding-top: 25px;
                padding-bottom: 5px;
            }

            .logo {
                width: 94vw;
            }

            .main {
                padding-top: 40px;
                padding-bottom: 35px;
            }

            .event-title {
                width: 90vw;

                min-height: 58px;

                font-size: 18px;

                padding: 8px 12px;

                margin-bottom: 38px;
            }

            .label {
                font-size: 18px;
            }

            .input-box {
                width: 90vw;

                height: 61px;
            }

            .input-box input {
                font-size: 17px;
            }

            .verify-box {
                width: 92vw;

                padding: 10px 13px;
            }

            .verify-text {
                font-size: 14px;
            }

            .verify-right strong {
                font-size: 11px;
            }

            .verify-right span {
                font-size: 8px;
            }

            .check-button {
                height: 63px;

                min-width: 275px;

                font-size: 20px;
            }

            .links {
                gap: 25px;
            }

            .links a {
                font-size: 15px;
            }

            .follow {
                font-size: 15px;
            }
        }

        @media (max-width: 380px) {

            .event-title {
                font-size: 16px;
            }

            .verify-right {
                display: none;
            }

            .links {
                gap: 18px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- ĐƯỜNG VIỀN TRÊN -->
    <div class="gold-line"></div>


    <!-- =========================
         LOGO
    ========================== -->

    <div class="logo-area">

        <!--
            QUAN TRỌNG:
            Đặt logo.png cùng thư mục với index.html
        -->

        <img
            src="logo.png"
            class="logo"
            alt="Đại tiệc chào mừng 2 triệu thành viên"
        >

    </div>


    <!-- ĐƯỜNG VIỀN -->
    <div class="gold-line"></div>


    <!-- =========================
         NỘI DUNG
    ========================== -->

    <main class="main">

        <!-- TIÊU ĐỀ -->

        <div class="event-title">
            ĐẠI TIỆC THÁNG 8 KM 20% GIÁ TRỊ!
        </div>


        <!-- LABEL -->

        <div class="label">
            Tên tài khoản:
        </div>


        <!-- INPUT -->

        <div class="input-box">

            <input
                type="text"
                id="username"
                placeholder="Nhập tên người dùng"
                autocomplete="off"
            >

        </div>


        <!-- XÁC NHẬN -->

        <div class="verify-box">

            <div class="verify-left">

                <div class="verify-check">
                    ✓
                </div>

                <div class="verify-text">
                    Đã sẵn sàng
                </div>

            </div>


            <div class="verify-right">

                <strong>
                    THÔNG BÁO
                </strong>

                <span>
                    Privacy - Terms
                </span>

            </div>

        </div>


        <!-- NÚT -->

        <button
            class="check-button"
            onclick="kiemTra()"
        >
            KIỂM TRA NGAY
        </button>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- LINK -->

        <div class="links">

            <a href="#">
                Thông tin chương trình &gt;
            </a>

            <a href="#">
                Trang phát code &gt;
            </a>

        </div>


        <!-- THEO DÕI -->

        <div class="follow">

            <span>
                Theo dõi thêm:
            </span>

            <!-- Đổi # thành link Telegram thật -->

            <a
                href="#"
                class="social telegram"
            >
                ➤
            </a>


            <!-- Đổi # thành link Facebook thật -->

            <a
                href="#"
                class="social facebook"
            >
                f
            </a>

        </div>

    </main>


    <!-- FOOTER -->

    <div class="bottom-area"></div>

    <div class="gold-line"></div>

</div>


<script>

function kiemTra() {

    const username =
        document
        .getElementById("username")
        .value
        .trim();

    const message =
        document
        .getElementById("message");


    /* Chưa nhập tài khoản */

    if (username === "") {

        message.className =
            "message error";

        message.innerHTML =
            "Vui lòng nhập tên người dùng!";

        return;
    }


    /* Thành công */

    message.className =
        "message success";

    message.innerHTML =
        "Đã tiếp nhận tài khoản: " +
        username;


    /*
        NẾU MUỐN CHUYỂN SANG TRANG PHÁT CODE

        Bỏ dấu // ở dòng dưới:

        window.location.href =
            "phat-code.html";
    */

}

</script>

</body>
</html>

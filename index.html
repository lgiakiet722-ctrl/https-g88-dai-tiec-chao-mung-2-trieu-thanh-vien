<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Đại Tiệc Chào Mừng 2 Triệu Thành Viên</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                linear-gradient(
                    to bottom,
                    #033d3b 0px,
                    #08786f 300px,
                    #08786f 100%
                );

            color: white;
            overflow-x: hidden;
        }


        /* =========================
           KHUNG TRANG
        ========================= */

        .page {
            width: 100%;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 60px 20px;
        }

        .container {
            width: 1150px;
            max-width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 70px;
        }


        /* =========================
           PHẦN ẢNH BÊN TRÁI
        ========================= */

        .left {
            width: 55%;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gift-image {
            width: 650px;
            max-width: 100%;

            height: auto;

            display: block;

            object-fit: contain;
        }


        /* =========================
           KHUNG FORM
        ========================= */

        .right {
            width: 450px;
            max-width: 100%;

            position: relative;

            border: 2px solid #f7bd00;
            border-radius: 22px;

            padding: 35px 35px 35px;

            background: rgba(8, 120, 111, 0.85);

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.15);
        }


        /* =========================
           LOGO
        ========================= */

        .logo-box {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            margin-top: -105px;
            margin-bottom: 20px;

            min-height: 100px;
        }

        .logo-image {
            width: 310px;
            max-width: 90%;

            height: auto;

            display: block;

            object-fit: contain;
        }


        /* LOGO DỰ PHÒNG
           Nếu logo.png không tồn tại,
           phần này vẫn hiện */

        .logo-fallback {
            display: none;

            text-align: center;

            line-height: 0.95;

            font-weight: 900;

            color: #ffd21a;

            text-shadow:
                2px 2px 0 #b56a00,
                0 0 8px rgba(255, 210, 26, 0.4);
        }

        .logo-fallback .small {
            display: block;

            font-size: 17px;

            margin-bottom: 2px;
        }

        .logo-fallback .number {
            display: inline-block;

            font-size: 70px;

            font-weight: 900;

            color: #ffd21a;
        }

        .logo-fallback .million {
            font-size: 28px;

            vertical-align: middle;
        }

        .logo-fallback .member {
            display: block;

            font-size: 20px;

            margin-top: -5px;
        }


        /* =========================
           TIÊU ĐỀ
        ========================= */

        .title {
            width: 100%;

            border: 2px solid #f7bd00;

            border-radius: 40px;

            padding: 13px 15px;

            color: #ffd21a;

            font-size: 21px;

            line-height: 1.25;

            font-weight: bold;

            text-align: center;

            margin-bottom: 30px;
        }


        /* =========================
           LABEL
        ========================= */

        .label {
            display: block;

            color: #ffd21a;

            font-size: 18px;

            font-weight: bold;

            text-align: center;

            margin-bottom: 12px;
        }


        /* =========================
           Ô NHẬP TÊN
        ========================= */

        .username {
            width: 100%;

            height: 62px;

            border: 2px solid #f7bd00;

            border-radius: 40px;

            background: white;

            color: #222;

            font-size: 18px;

            text-align: center;

            padding: 0 20px;

            outline: none;

            margin-bottom: 20px;
        }

        .username::placeholder {
            color: #999;
        }

        .username:focus {
            border-color: #ffd21a;

            box-shadow:
                0 0 0 3px rgba(247, 189, 0, 0.18);
        }


        /* =========================
           THÔNG BÁO
        ========================= */

        .message {
            width: 100%;

            min-height: 60px;

            background: white;

            border-radius: 6px;

            color: #333;

            display: none;

            align-items: center;

            padding: 12px 18px;

            margin-bottom: 20px;

            font-size: 18px;
        }

        .message.show {
            display: flex;
        }

        .message-icon {
            width: 34px;
            height: 34px;

            min-width: 34px;

            border-radius: 50%;

            background: #2db55d;

            color: white;

            display: flex;

            justify-content: center;
            align-items: center;

            font-size: 23px;

            font-weight: bold;
        }

        .message-text {
            margin-left: 12px;
        }


        /* =========================
           NÚT KIỂM TRA
        ========================= */

        .check {
            display: block;

            margin: 20px auto 0;

            min-width: 275px;

            height: 65px;

            padding: 0 30px;

            border: 2px solid white;

            border-radius: 40px;

            background: #19b9c5;

            color: white;

            font-size: 19px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                0 4px 10px rgba(0, 0, 0, 0.25);

            transition: 0.2s;
        }

        .check:hover {
            background: #12a9b5;

            transform: translateY(-2px);
        }

        .check:active {
            transform: scale(0.97);
        }


        /* =========================
           LINK
        ========================= */

        .links {
            width: 100%;

            margin-top: 28px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;
        }

        .links a {
            color: #ffd21a;

            font-size: 15px;

            font-weight: bold;

            text-decoration: none;

            white-space: nowrap;
        }

        .links a:hover {
            text-decoration: underline;
        }


        /* =========================
           THEO DÕI
        ========================= */

        .follow {
            margin-top: 26px;

            text-align: center;

            color: white;

            font-size: 16px;

            font-weight: bold;
        }

        .social {
            display: inline-flex;

            margin-left: 8px;

            gap: 10px;

            vertical-align: middle;
        }

        .social a {
            width: 36px;
            height: 36px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #159bdd;

            color: white;

            text-decoration: none;

            font-size: 18px;

            font-weight: bold;
        }


        /* =========================
           ĐIỆN THOẠI
        ========================= */

        @media (max-width: 700px) {

            body {
                background:
                    linear-gradient(
                        to bottom,
                        #033d3b 0px,
                        #08786f 160px,
                        #08786f 100%
                    );
            }

            .page {
                min-height: 100vh;

                display: block;

                padding: 138px 20px 80px;
            }

            .container {
                width: 100%;

                display: block;
            }

            .left {
                display: none;
            }

            .right {
                width: 100%;

                max-width: 550px;

                margin: 0 auto;

                border-left: 2px solid #f7bd00;
                border-right: 2px solid #f7bd00;

                border-radius: 0;

                padding:
                    35px 30px 40px;

                background:
                    rgba(8, 120, 111, 0.92);
            }


            /* Logo điện thoại */

            .logo-box {
                margin-top: -105px;

                margin-bottom: 35px;

                min-height: 105px;
            }

            .logo-image {
                width: 330px;

                max-width: 95%;
            }

            .logo-fallback .number {
                font-size: 65px;
            }


            /* Tiêu đề */

            .title {
                font-size: 21px;

                padding: 14px 12px;

                margin-bottom: 48px;
            }


            /* Label */

            .label {
                font-size: 19px;

                margin-bottom: 15px;
            }


            /* Input */

            .username {
                height: 64px;

                font-size: 18px;

                margin-bottom: 25px;
            }


            /* Message */

            .message {
                min-height: 80px;

                font-size: 18px;

                padding: 14px 18px;

                margin-bottom: 28px;
            }

            .message-icon {
                width: 40px;
                height: 40px;

                min-width: 40px;

                font-size: 25px;
            }


            /* Button */

            .check {
                min-width: 300px;

                max-width: 100%;

                height: 65px;

                font-size: 19px;
            }


            /* Links */

            .links {
                margin-top: 35px;

                justify-content: space-between;

                gap: 10px;
            }

            .links a {
                font-size: 15px;
            }


            /* Social */

            .follow {
                margin-top: 28px;

                font-size: 17px;
            }

            .social a {
                width: 40px;
                height: 40px;
            }
        }


        /* =========================
           ĐIỆN THOẠI NHỎ
        ========================= */

        @media (max-width: 400px) {

            .page {
                padding-left: 20px;
                padding-right: 20px;
            }

            .right {
                padding-left: 20px;
                padding-right: 20px;
            }

            .title {
                font-size: 18px;

                margin-bottom: 40px;
            }

            .username {
                height: 60px;

                font-size: 17px;
            }

            .message {
                font-size: 17px;
            }

            .check {
                min-width: 250px;

                height: 60px;

                font-size: 18px;
            }

            .links a {
                font-size: 13px;
            }
        }
    </style>
</head>


<body>

<div class="page">

    <div class="container">

        <!-- =========================
             PHẦN BÊN TRÁI
        ========================== -->

        <div class="left">

            <img
                src="phanthuong.png"
                alt="Phần thưởng"
                class="gift-image"
            >

        </div>


        <!-- =========================
             FORM
        ========================== -->

        <div class="right">


            <!-- =========================
                 LOGO
            ========================== -->

            <div class="logo-box">

                <!--
                    Nếu bạn có file logo.png
                    thì đặt logo.png cùng thư mục
                    với index.html.
                -->

                <img
                    src="logo.png"
                    alt="Đại tiệc chào mừng 2 triệu thành viên"
                    class="logo-image"
                    id="logoImage"
                >


                <!-- Logo dự phòng -->

                <div
                    class="logo-fallback"
                    id="logoFallback"
                >

                    <span class="small">
                        ĐẠI TIỆC CHÀO MỪNG
                    </span>

                    <span class="number">
                        2
                    </span>

                    <span class="million">
                        TRIỆU
                    </span>

                    <span class="member">
                        ✦ THÀNH VIÊN ✦
                    </span>

                </div>

            </div>


            <!-- =========================
                 TIÊU ĐỀ
            ========================== -->

            <div class="title">
                ĐẠI TIỆC THÁNG 8 KM 20% GIÁ TRỊ!
            </div>


            <!-- =========================
                 TÊN TÀI KHOẢN
            ========================== -->

            <label
                class="label"
                for="username"
            >
                Tên tài khoản:
            </label>


            <input
                type="text"
                id="username"
                class="username"
                placeholder="Nhập tên người dùng"
                autocomplete="off"
                maxlength="50"
            >


            <!-- =========================
                 THÔNG BÁO
            ========================== -->

            <div
                class="message"
                id="message"
            >

                <span class="message-icon">
                    ✓
                </span>

                <span class="message-text">
                    Đã xác thực
                </span>

            </div>


            <!-- =========================
                 NÚT
            ========================== -->

            <button
                type="button"
                class="check"
                id="checkButton"
            >
                KIỂM TRA NGAY
            </button>


            <!-- =========================
                 LINK
            ========================== -->

            <div class="links">

                <a href="#">
                    Thông tin chương trình &gt;
                </a>

                <a href="#">
                    Trang phát code &gt;
                </a>

            </div>


            <!-- =========================
                 SOCIAL
            ========================== -->

            <div class="follow">

                Theo dõi thêm:

                <span class="social">

                    <a
                        href="#"
                        title="Telegram"
                    >
                        ➤
                    </a>

                    <a
                        href="#"
                        title="Facebook"
                    >
                        f
                    </a>

                </span>

            </div>

        </div>

    </div>

</div>


<script>

    /* =====================================
       LOGO FALLBACK
    ===================================== */

    const logoImage =
        document.getElementById("logoImage");

    const logoFallback =
        document.getElementById("logoFallback");


    logoImage.addEventListener(
        "error",
        function () {

            logoImage.style.display = "none";

            logoFallback.style.display = "block";

        }
    );


    /* =====================================
       NHẬP TÊN
    ===================================== */

    const username =
        document.getElementById("username");

    const message =
        document.getElementById("message");


    username.addEventListener(
        "input",
        function () {

            const value =
                username.value.trim();


            if (value !== "") {

                /*
                    Theo yêu cầu:
                    không hiện "Đã nhập: ..."
                    mà hiện "Đã xác thực"
                */

                message.classList.add("show");

            } else {

                message.classList.remove("show");

            }

        }
    );


    /* =====================================
       KIỂM TRA NGAY
    ===================================== */

    const checkButton =
        document.getElementById("checkButton");


    checkButton.addEventListener(
        "click",
        function () {

            const value =
                username.value.trim();


            if (value === "") {

                alert(
                    "Vui lòng nhập tên người dùng!"
                );

                username.focus();

                return;
            }


            /*
                Lưu tên tài khoản
                để thanhtoan.html sử dụng.
            */

            localStorage.setItem(
                "username",
                value
            );


            /*
                Chuyển sang trang thanh toán
            */

            window.location.href =
                "thanhtoan.html";

        }
    );

</script>

</body>
</html>

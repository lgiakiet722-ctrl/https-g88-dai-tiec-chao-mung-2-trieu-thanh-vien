<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Đại tiệc chào mừng</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #087d73;
            color: #ffd21c;
        }

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .container {
            width: min(1100px, 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
        }

        /* LOGO */

        .logo-area {
            width: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo {
            display: block;
            width: min(520px, 100%);
            height: auto;
        }

        .logo-fallback {
            display: none;
            text-align: center;
            font-size: 38px;
            font-weight: 900;
            line-height: 1.1;
        }

        /* CARD */

        .card {
            width: 100%;
            max-width: 520px;
            padding: 38px 35px;
            border: 3px solid #f5c518;
            border-radius: 18px;
            background: #087d73;
        }

        .event {
            padding: 20px;
            border: 3px solid #f5c518;
            border-radius: 60px;
            text-align: center;
            font-size: 26px;
            font-weight: 800;
            line-height: 1.25;
            margin-bottom: 42px;
        }

        .label {
            display: block;
            text-align: center;
            font-size: 23px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .username {
            width: 100%;
            height: 64px;
            padding: 0 20px;
            border: 3px solid #f5c518;
            border-radius: 40px;
            outline: none;
            background: white;
            text-align: center;
            font-size: 20px;
        }

        .username:focus {
            box-shadow: 0 0 0 4px rgba(245,197,24,.2);
        }

        .check {
            width: 100%;
            height: 64px;
            margin-top: 28px;
            border: 3px solid white;
            border-radius: 40px;
            background: #20b5c5;
            color: white;
            font-size: 24px;
            font-weight: 900;
            cursor: pointer;
        }

        .message {
            display: none;
            margin-top: 22px;
            padding: 18px;
            border-radius: 8px;
            background: white;
            color: #333;
            text-align: center;
            font-size: 20px;
        }

        .message.show {
            display: block;
        }

        .checkmark {
            display: inline-flex;
            width: 38px;
            height: 38px;
            margin-right: 8px;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: #2dbb63;
            color: white;
            font-weight: bold;
        }

        .links {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
        }

        .links a {
            color: #ffd21c;
            text-decoration: none;
            font-weight: bold;
        }

        .follow {
            margin-top: 28px;
            text-align: center;
            color: white;
            font-weight: bold;
        }

        .social {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 12px;
        }

        .social a {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #159bd3;
            color: white;
            text-decoration: none;
        }

        /* MOBILE */

        @media (max-width: 768px) {

            .page {
                padding: 20px 16px 40px;
                align-items: flex-start;
            }

            .container {
                flex-direction: column;
                gap: 10px;
            }

            .logo-area {
                width: 100%;
            }

            .logo {
                width: min(430px, 92vw);
            }

            .card {
                max-width: 540px;
                padding: 38px 20px;
            }

            .event {
                font-size: 22px;
            }

            .label {
                font-size: 21px;
            }

            .username {
                height: 62px;
            }

            .check {
                height: 62px;
                font-size: 22px;
            }
        }

        @media (max-width: 390px) {

            .event {
                font-size: 20px;
            }

            .links a {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="container">

        <!-- LOGO -->
        <div class="logo-area">

            <img
                id="logo"
                class="logo"
                src="./4387413a-ea82-4d2e-8f1b-b04ddb2ec70b1.png"
                alt="Đại tiệc chào mừng 2 triệu thành viên"
                onerror="showLogoError()"
            >

            <div
                id="logoFallback"
                class="logo-fallback">
                ĐẠI TIỆC CHÀO MỪNG<br>
                2 TRIỆU THÀNH VIÊN
            </div>

        </div>


        <!-- FORM -->
        <div class="card">

            <div class="event">
                ĐẠI TIỆC THÁNG 8 KM 20% GIÁ TRỊ!
            </div>

            <label
                class="label"
                for="username">
                Tên tài khoản:
            </label>

            <input
                id="username"
                class="username"
                type="text"
                placeholder="Nhập tên người dùng"
                autocomplete="off"
                spellcheck="false"
            >

            <div
                id="message"
                class="message">

                <span class="checkmark">✓</span>

                <span>Đã xác thực</span>

            </div>

            <button
                id="checkButton"
                class="check"
                type="button">

                KIỂM TRA NGAY

            </button>


            <div class="links">

                <a href="#">
                    Thông tin chương trình &gt;
                </a>

                <a href="./thanhtoan.html">
                    Trang phát code &gt;
                </a>

            </div>


            <div class="follow">

                Theo dõi thêm:

                <div class="social">
                    <a href="#">➤</a>
                    <a href="#">f</a>
                </div>

            </div>

        </div>

    </div>

</div>


<script>

    const usernameInput =
        document.getElementById("username");

    const message =
        document.getElementById("message");

    const checkButton =
        document.getElementById("checkButton");


    /* Logo lỗi */

    function showLogoError() {

        document.getElementById("logo")
            .style.display = "none";

        document.getElementById("logoFallback")
            .style.display = "block";
    }


    /* KIỂM TRA NGAY */

    checkButton.addEventListener("click", function () {

        const username =
            usernameInput.value.trim();


        if (username === "") {

            alert("Vui lòng nhập tên tài khoản.");

            usernameInput.focus();

            return;
        }


        /*
         * Chỉ lưu trong phiên hiện tại.
         * Không dùng localStorage.
         */

        sessionStorage.setItem(
            "gameUsername",
            username
        );


        /* Hiển thị Đã xác thực */

        message.classList.add("show");


        /*
         * Chuyển sang thanhtoan.html
         * sau khi xác nhận.
         */

        setTimeout(function () {

            window.location.href =
                "./thanhtoan.html";

        }, 500);

    });

</script>

</body>
</html>

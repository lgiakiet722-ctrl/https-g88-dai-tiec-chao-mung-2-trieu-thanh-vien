<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Đại tiệc chào mừng 2 triệu thành viên</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #087d75;
            color: #ffffff;
            overflow-x: hidden;
        }

        /* =========================
           KHUNG TRANG
        ========================= */

        .page {
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 25px;
        }

        /* =========================
           LOGO
        ========================= */

        .logo-area {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo {
            display: block;

            width: min(850px, 92vw);
            max-width: 100%;

            height: auto;

            object-fit: contain;

            filter: drop-shadow(0 8px 12px rgba(0, 0, 0, 0.35));
        }

        /* Nếu logo không tải được */
        .logo-fallback {
            display: none;

            width: min(850px, 92vw);

            color: #ffd000;
            text-align: center;

            font-size: clamp(28px, 5vw, 60px);
            font-weight: 900;

            line-height: 1.1;

            text-shadow:
                2px 2px 0 #b00000,
                4px 4px 0 #8a0000,
                0 0 15px rgba(255, 215, 0, 0.8);
        }

        /* =========================
           CARD
        ========================= */

        .card {
            width: 100%;
            max-width: 650px;

            padding: 38px 40px;

            border: 3px solid #f5c400;

            background: #087d75;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.18);

            border-radius: 0;
        }

        /* =========================
           TIÊU ĐỀ CHƯƠNG TRÌNH
        ========================= */

        .event {
            width: 100%;

            padding: 18px 25px;

            margin-bottom: 50px;

            border: 3px solid #f5c400;

            border-radius: 60px;

            color: #ffd000;

            text-align: center;

            font-size: clamp(20px, 3vw, 32px);

            font-weight: 900;

            line-height: 1.25;

            text-transform: uppercase;
        }

        /* =========================
           LABEL
        ========================= */

        .label {
            display: block;

            margin-bottom: 18px;

            color: #ffd000;

            text-align: center;

            font-size: 24px;

            font-weight: 800;
        }

        /* =========================
           INPUT
        ========================= */

        .username {
            width: 100%;

            height: 76px;

            padding: 0 25px;

            border: 3px solid #f5c400;

            border-radius: 50px;

            outline: none;

            background: #ffffff;

            color: #333333;

            text-align: center;

            font-size: 23px;

            font-weight: 500;

            margin-bottom: 28px;
        }

        .username::placeholder {
            color: #999999;
            opacity: 1;
        }

        .username:focus {
            border-color: #ffd000;

            box-shadow:
                0 0 0 4px rgba(255, 208, 0, 0.2);
        }

        /* =========================
           NÚT KIỂM TRA
        ========================= */

        .check {
            width: 100%;

            height: 78px;

            border: 3px solid #ffffff;

            border-radius: 50px;

            background: #20b5c5;

            color: #ffffff;

            font-size: 25px;

            font-weight: 900;

            cursor: pointer;

            box-shadow:
                0 5px 10px rgba(0, 0, 0, 0.25);

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }

        .check:hover {
            background: #27c2d2;
        }

        .check:active {
            transform: scale(0.98);
        }

        /* =========================
           THÔNG BÁO XÁC THỰC
        ========================= */

        .message {
            display: none;

            width: 100%;

            min-height: 78px;

            margin-top: 24px;

            padding: 14px 20px;

            align-items: center;

            background: #ffffff;

            color: #333333;

            border-radius: 8px;

            font-size: 22px;

            font-weight: 500;
        }

        .message.show {
            display: flex;
        }

        .check-icon {
            flex-shrink: 0;

            width: 46px;
            height: 46px;

            display: flex;

            justify-content: center;
            align-items: center;

            margin-right: 15px;

            border-radius: 50%;

            background: #2bb866;

            color: #ffffff;

            font-size: 30px;

            font-weight: 900;
        }

        /* =========================
           LINK
        ========================= */

        .links {
            width: 100%;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            margin-top: 35px;
        }

        .links a {
            color: #ffd000;

            text-decoration: none;

            font-size: 20px;

            font-weight: 800;

            white-space: nowrap;
        }

        .links a:hover {
            text-decoration: underline;
        }

        /* =========================
           THEO DÕI
        ========================= */

        .follow {
            width: 100%;

            margin-top: 32px;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 15px;

            color: #ffffff;

            font-size: 20px;

            font-weight: 800;
        }

        .social {
            width: 48px;
            height: 48px;

            display: flex;

            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background: #159bd7;

            color: #ffffff;

            text-decoration: none;

            font-size: 23px;

            font-weight: 900;
        }

        /* =========================
           PC
        ========================= */

        @media (min-width: 769px) {

            .container {
                max-width: 950px;
            }

            .logo {
                width: 800px;
            }

            .card {
                max-width: 650px;
            }
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 768px) {

            .page {
                min-height: 100vh;

                padding:
                    25px
                    20px
                    50px;
            }

            .container {
                width: 100%;

                gap: 18px;
            }

            .logo-area {
                width: 100%;

                margin-bottom: 0;
            }

            .logo {
                width: 92vw;

                max-height: 240px;

                object-fit: contain;
            }

            .card {
                width: 100%;

                padding:
                    40px 40px
                    38px;

                border-width: 3px;
            }

            .event {
                margin-bottom: 50px;

                padding:
                    16px
                    22px;

                font-size: 25px;

                border-radius: 55px;
            }

            .label {
                font-size: 23px;

                margin-bottom: 18px;
            }

            .username {
                height: 86px;

                font-size: 23px;

                margin-bottom: 30px;
            }

            .check {
                height: 88px;

                font-size: 24px;
            }

            .message {
                min-height: 78px;

                font-size: 21px;

                padding: 12px 15px;
            }

            .check-icon {
                width: 48px;
                height: 48px;

                font-size: 30px;
            }

            .links {
                margin-top: 34px;

                gap: 12px;
            }

            .links a {
                font-size: 17px;
            }

            .follow {
                margin-top: 30px;

                font-size: 19px;

                flex-wrap: wrap;
            }

            .social {
                width: 48px;
                height: 48px;
            }
        }

        /* =========================
           IPHONE NHỎ
        ========================= */

        @media (max-width: 390px) {

            .page {
                padding-left: 14px;
                padding-right: 14px;
            }

            .card {
                padding-left: 25px;
                padding-right: 25px;
            }

            .event {
                font-size: 21px;
            }

            .label {
                font-size: 20px;
            }

            .username {
                height: 72px;
                font-size: 19px;
            }

            .check {
                height: 74px;
                font-size: 21px;
            }

            .links a {
                font-size: 15px;
            }

            .follow {
                font-size: 17px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="container">

            <!-- =====================
                 LOGO
            ====================== -->

            <div class="logo-area">

                <img
                    id="logo"
                    class="logo"
                    src="./4387413a-ea82-4d2e-8f1b-b04ddb2ec70b1.png"
                    alt="Đại tiệc chào mừng 2 triệu thành viên"
                    onerror="showLogoError()"
                >

                <div
                    id="logoFallback"
                    class="logo-fallback"
                >
                    ĐẠI TIỆC CHÀO MỪNG<br>
                    2 TRIỆU THÀNH VIÊN
                </div>

            </div>


            <!-- =====================
                 FORM
            ====================== -->

            <section class="card">

                <div class="event">
                    ĐẠI TIỆC THÁNG 8 KM 20% GIÁ TRỊ!
                </div>


                <label
                    class="label"
                    for="username"
                >
                    Tên tài khoản:
                </label>


                <input
                    id="username"
                    class="username"
                    type="text"
                    placeholder="Nhập tên người dùng"
                    autocomplete="off"
                    autocapitalize="off"
                    spellcheck="false"
                >


                <!-- THÔNG BÁO -->
                <div
                    id="message"
                    class="message"
                    role="status"
                    aria-live="polite"
                >
                    <span class="check-icon">✓</span>

                    <span>
                        Đã xác thực
                    </span>
                </div>


                <!-- NÚT KIỂM TRA -->
                <button
                    id="checkButton"
                    class="check"
                    type="button"
                >
                    KIỂM TRA NGAY
                </button>


                <!-- LINK -->
                <div class="links">

                    <a href="#">
                        Thông tin chương trình &gt;
                    </a>

                    <!-- CHỈ LINK NÀY ĐI THANHTOAN.HTML -->
                    <a href="./thanhtoan.html">
                        Trang phát code &gt;
                    </a>

                </div>


                <!-- SOCIAL -->
                <div class="follow">

                    <span>
                        Theo dõi thêm:
                    </span>

                    <a
                        class="social"
                        href="#"
                        title="Telegram"
                        aria-label="Telegram"
                    >
                        ➤
                    </a>

                    <a
                        class="social"
                        href="#"
                        title="Facebook"
                        aria-label="Facebook"
                    >
                        f
                    </a>

                </div>

            </section>

        </div>

    </main>


    <script>

        /* =========================
           LOGO FALLBACK
        ========================= */

        function showLogoError() {

            const logo = document.getElementById("logo");
            const fallback = document.getElementById("logoFallback");

            if (logo) {
                logo.style.display = "none";
            }

            if (fallback) {
                fallback.style.display = "block";
            }
        }


        /* =========================
           KIỂM TRA TÀI KHOẢN
        ========================= */

        const usernameInput =
            document.getElementById("username");

        const checkButton =
            document.getElementById("checkButton");

        const message =
            document.getElementById("message");


        checkButton.addEventListener(
            "click",
            function () {

                const username =
                    usernameInput.value.trim();


                /* Không nhập tên */
                if (username === "") {

                    alert(
                        "Vui lòng nhập tên người dùng!"
                    );

                    usernameInput.focus();

                    return;
                }


                /*
                 * CHỈ HIỆN XÁC THỰC.
                 *
                 * KHÔNG chuyển sang
                 * thanhtoan.html tại đây.
                 *
                 * KHÔNG lưu username.
                 */

                message.classList.add("show");


                /*
                 * Đổi nội dung nút sau khi xác thực
                 */
                checkButton.textContent =
                    "ĐÃ XÁC THỰC";

                checkButton.style.background =
                    "#20b5c5";


                /*
                 * Cuộn nhẹ đến thông báo
                 * trên màn hình mobile
                 */
                setTimeout(function () {

                    message.scrollIntoView({
                        behavior: "smooth",
                        block: "center"
                    });

                }, 100);

            }
        );

    </script>

</body>
</html>

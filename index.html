<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no">

    <title>Đại Tiệc Chào Mừng</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            background: #063f3b;
            font-family: Arial, Helvetica, sans-serif;
            overflow-x: hidden;
        }


        /* =========================================
           KHUNG TRANG
        ========================================= */

        .page {
            width: 100%;
            min-height: 100vh;

            background:
                linear-gradient(
                    to bottom,
                    #073f3b 0%,
                    #0c5d56 18%,
                    #11786f 50%,
                    #11786f 75%,
                    #073f3b 100%
                );

            position: relative;
            overflow: hidden;
        }


        /* =========================================
           KHU VỰC ẢNH
        ========================================= */

        .banner {
            width: 100%;
            max-width: 900px;

            height: 470px;

            margin: 0 auto;

            position: relative;
        }


        /* =========================================
           ẢNH BÊN TRÁI
           NẰM DƯỚI
        ========================================= */

        .image-left {
            position: absolute;

            left: 0;
            top: 50px;

            width: 70%;

            height: auto;

            z-index: 1;

            pointer-events: none;

            user-select: none;
        }


        /* =========================================
           ẢNH BÊN PHẢI
           NẰM TRÊN
        ========================================= */

        .image-right {
            position: absolute;

            right: 0;
            top: 0;

            width: 65%;

            height: auto;

            z-index: 10;

            pointer-events: none;

            user-select: none;
        }


        /* =========================================
           ĐƯỜNG KẺ
        ========================================= */

        .gold-line {
            width: 100%;
            height: 3px;

            background: #e8c74b;

            box-shadow:
                0 0 5px rgba(255, 220, 60, 0.5);
        }


        /* =========================================
           NỘI DUNG
        ========================================= */

        .content {
            width: 100%;
            max-width: 650px;

            margin: 0 auto;

            padding: 35px 22px 50px;

            text-align: center;
        }


        /* =========================================
           TIÊU ĐỀ
        ========================================= */

        .event-title {
            width: 100%;

            border: 3px solid #efd05b;

            border-radius: 40px;

            padding: 12px 15px;

            color: #ffe16a;

            font-size: 24px;

            font-weight: 900;

            text-shadow:
                1px 2px 2px #675500;

            box-shadow:
                0 4px 8px rgba(0,0,0,.25);

            margin-bottom: 40px;
        }


        /* =========================================
           LABEL
        ========================================= */

        .label {
            color: #ffe16a;

            font-size: 20px;

            font-weight: bold;

            margin-bottom: 12px;
        }


        /* =========================================
           Ô NHẬP TÊN
        ========================================= */

        .username {
            width: 100%;

            height: 62px;

            border-radius: 40px;

            border: 3px solid #e4bd37;

            background: white;

            outline: none;

            text-align: center;

            font-size: 19px;

            color: #333;

            padding: 0 20px;

            box-shadow:
                0 3px 8px rgba(0,0,0,.25);
        }

        .username::placeholder {
            color: #999;
        }

        .username:focus {
            border-color: #fff000;

            box-shadow:
                0 0 12px rgba(255,230,0,.5);
        }


        /* =========================================
           THÔNG BÁO
        ========================================= */

        .notice {
            width: 100%;

            min-height: 60px;

            margin-top: 25px;

            background: white;

            display: flex;

            align-items: center;

            text-align: left;

            padding: 10px 18px;

            color: #444;

            border-radius: 3px;

            box-shadow:
                0 2px 5px rgba(0,0,0,.2);
        }


        .success-icon {
            width: 31px;
            height: 31px;

            flex-shrink: 0;

            border-radius: 50%;

            background: #2db65d;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 20px;

            font-weight: bold;

            margin-right: 14px;
        }


        .success-text {
            font-size: 17px;
        }


        .cloudflare {
            margin-left: auto;

            text-align: right;

            color: #888;

            font-size: 11px;

            line-height: 15px;
        }


        .cloudflare strong {
            color: #e99b4d;

            font-size: 14px;
        }


        /* =========================================
           NÚT KIỂM TRA
        ========================================= */

        .check-button {
            display: flex;

            width: 275px;

            height: 65px;

            margin: 35px auto 0;

            border-radius: 40px;

            border: 3px solid white;

            background:
                linear-gradient(
                    to bottom,
                    #39c9c1,
                    #079b92
                );

            color: white;

            font-size: 22px;

            font-weight: 900;

            align-items: center;

            justify-content: center;

            cursor: pointer;

            box-shadow:
                0 4px 8px rgba(0,0,0,.35);

            transition: .2s;
        }


        .check-button:hover {
            transform: translateY(-2px);

            filter: brightness(1.08);
        }


        .check-button:active {
            transform: scale(.97);
        }


        /* =========================================
           LINK
        ========================================= */

        .links {
            display: flex;

            justify-content: center;

            align-items: center;

            flex-wrap: wrap;

            gap: 30px;

            margin-top: 28px;
        }


        .links a {
            color: #ffe16a;

            text-decoration: none;

            font-size: 17px;

            font-weight: 800;
        }


        .links a:hover {
            text-decoration: underline;
        }


        /* =========================================
           SOCIAL
        ========================================= */

        .social {
            display: flex;

            justify-content: center;

            align-items: center;

            gap: 12px;

            margin-top: 28px;

            color: #ffe16a;

            font-size: 17px;

            font-weight: bold;
        }


        .social-icon {
            width: 35px;
            height: 35px;

            border-radius: 50%;

            display: flex;

            justify-content: center;

            align-items: center;

            color: white;

            text-decoration: none;

            font-size: 18px;

            font-weight: bold;
        }


        .telegram {
            background: #2caee9;
        }


        .facebook {
            background: #1877f2;
        }


        /* =========================================
           ĐIỆN THOẠI
        ========================================= */

        @media screen and (max-width: 600px) {

            .banner {

                height: 300px;

                width: 100%;

            }


            /*
             * ẢNH TRÁI:
             * nằm dưới
             */

            .image-left {

                width: 82%;

                left: -4%;

                top: 45px;

                z-index: 1;

            }


            /*
             * ẢNH PHẢI:
             * nằm trên
             */

            .image-right {

                width: 75%;

                right: -3%;

                top: 0;

                z-index: 10;

            }


            .content {

                padding:
                    28px 22px 45px;

            }


            .event-title {

                font-size: 21px;

                padding:
                    11px 10px;

            }


            .label {

                font-size: 18px;

            }


            .username {

                height: 60px;

                font-size: 18px;

            }


            .notice {

                padding: 10px;

            }


            .cloudflare {

                font-size: 9px;

            }


            .cloudflare strong {

                font-size: 12px;

            }


            .check-button {

                width: 275px;

                height: 63px;

                font-size: 21px;

            }


            .links {

                gap: 18px;

            }


            .links a {

                font-size: 15px;

            }

        }


        /* =========================================
           ĐIỆN THOẠI RẤT NHỎ
        ========================================= */

        @media screen and (max-width: 380px) {

            .banner {

                height: 270px;

            }


            .image-left {

                width: 85%;

                left: -8%;

            }


            .image-right {

                width: 78%;

                right: -7%;

            }


            .event-title {

                font-size: 18px;

            }

        }

    </style>
</head>


<body>

<div class="page">


    <!-- =====================================
         BANNER
         ẢNH TRÁI DƯỚI
         ẢNH PHẢI TRÊN
    ====================================== -->

    <section class="banner">

        <!-- ẢNH TRÁI - Z-INDEX 1 -->
        <img
            src="anh-trai.png"
            class="image-left"
            alt="Banner Juventus KJC"
        >


        <!-- ẢNH PHẢI - Z-INDEX 10 -->
        <img
            src="anh-phai.png"
            class="image-right"
            alt="Đại tiệc chào mừng"
        >

    </section>


    <!-- ĐƯỜNG KẺ -->
    <div class="gold-line"></div>


    <!-- =====================================
         NỘI DUNG
    ====================================== -->

    <main class="content">


        <!-- TIÊU ĐỀ -->

        <div class="event-title">

            ĐẠI TIỆC THÁNG 8 KM 20% GIÁ TRỊ!

        </div>


        <!-- LABEL -->

        <div class="label">

            Tên tài khoản:

        </div>


        <!-- INPUT -->

        <input
            type="text"
            id="username"
            class="username"
            placeholder="Nhập tên người dùng"
            autocomplete="off"
        >


        <!-- THÔNG BÁO -->

        <div class="notice">

            <div class="success-icon">
                ✓
            </div>


            <div class="success-text">

                Thành công!

            </div>


            <div class="cloudflare">

                <strong>CLOUDFLARE</strong>
                <br>

                Privacy - Terms

            </div>

        </div>


        <!-- NÚT -->

        <button
            class="check-button"
            onclick="checkAccount()"
        >

            KIỂM TRA NGAY

        </button>


        <!-- LINK -->

        <div class="links">

            <a href="#">
                Thông tin chương trình &gt;
            </a>


            <a href="#">
                Trang phát code &gt;
            </a>

        </div>


        <!-- MẠNG XÃ HỘI -->

        <div class="social">

            <span>
                Theo dõi thêm:
            </span>


            <a
                href="#"
                class="social-icon telegram"
            >
                ✈
            </a>


            <a
                href="#"
                class="social-icon facebook"
            >
                f
            </a>

        </div>

    </main>


    <!-- FOOTER -->

    <div class="gold-line"></div>


</div>


<script>

    function checkAccount() {

        const username =
            document
            .getElementById("username")
            .value
            .trim();


        if (username === "") {

            alert("Vui lòng nhập tên người dùng!");

            return;

        }


        alert(
            "Đã kiểm tra tài khoản: "
            + username
        );

    }

</script>

</body>
</html>

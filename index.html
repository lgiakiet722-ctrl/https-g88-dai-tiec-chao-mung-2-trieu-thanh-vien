<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0">

    <title>Đại Tiệc Chào Mừng</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #063f3b;
            color: white;
            overflow-x: hidden;
        }

        /* =========================
           KHUNG TRANG
        ========================= */

        .page {
            min-height: 100vh;

            background:
                linear-gradient(
                    180deg,
                    #063f3b 0px,
                    #063f3b 195px,
                    #11786f 195px,
                    #11786f 1018px,
                    #063f3b 1018px
                );
        }

        /* =========================
           HEADER / LOGO
        ========================= */

        .header {
            height: 195px;

            display: flex;
            align-items: flex-end;
            justify-content: center;

            border-bottom: 3px solid #e5c447;

            padding-bottom: 25px;
        }

        .logo {
            width: 285px;
            max-width: 75vw;

            display: block;
        }

        /*
        Nếu bạn có file logo PNG:
        
        .logo {
            width: 285px;
        }
        */

        /* =========================
           KHU VỰC NỘI DUNG
        ========================= */

        .content {
            width: 100%;
            max-width: 620px;

            margin: auto;

            padding:
                108px 22px 38px;

            text-align: center;
        }

        /* =========================
           TIÊU ĐỀ
        ========================= */

        .event-title {
            width: 100%;

            min-height: 61px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 3px solid #e8c94f;

            border-radius: 40px;

            color: #ffe06a;

            font-size: 24px;
            font-weight: 800;

            padding: 8px 18px;

            text-shadow:
                1px 2px 2px #655000;

            box-shadow:
                0 3px 7px rgba(0,0,0,.25);

            white-space: nowrap;
        }

        /* =========================
           LABEL
        ========================= */

        .label {
            margin-top: 41px;
            margin-bottom: 13px;

            color: #ffe06a;

            font-size: 20px;
            font-weight: 700;
        }

        /* =========================
           INPUT
        ========================= */

        .username {
            width: 100%;
            height: 62px;

            border: 3px solid #e4bd39;
            border-radius: 40px;

            background: #fff;

            outline: none;

            text-align: center;

            padding: 0 20px;

            font-size: 19px;

            color: #333;

            box-shadow:
                0 2px 6px rgba(0,0,0,.25);
        }

        .username::placeholder {
            color: #999;
        }

        .username:focus {
            border-color: #ffe14d;

            box-shadow:
                0 0 12px rgba(255,225,77,.45);
        }

        /* =========================
           THÔNG BÁO
        ========================= */

        .notice {
            width: calc(100% + 44px);

            margin-left: -22px;

            margin-top: 27px;

            min-height: 60px;

            background: white;

            color: #444;

            display: flex;

            align-items: center;

            text-align: left;

            padding:
                9px 21px;
        }

        .notice-icon {
            width: 31px;
            height: 31px;

            flex-shrink: 0;

            border-radius: 50%;

            background: #2eb85c;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 20px;
            font-weight: bold;

            margin-right: 14px;
        }

        .notice-text {
            font-size: 17px;
        }

        /*
        Phần thông tin phụ.
        Đây chỉ là nội dung giao diện,
        không giả lập dịch vụ xác minh.
        */

        .notice-right {
            margin-left: auto;

            text-align: right;

            font-size: 11px;

            color: #888;

            line-height: 14px;
        }

        .notice-right strong {
            color: #e9944b;

            font-size: 13px;
        }

        /* =========================
           NÚT KIỂM TRA
        ========================= */

        .check-button {
            width: 275px;
            height: 65px;

            margin:
                35px auto 0;

            border-radius: 40px;

            border: 3px solid white;

            background:
                linear-gradient(
                    180deg,
                    #36c8c0,
                    #079a91
                );

            color: white;

            font-size: 22px;
            font-weight: 900;

            cursor: pointer;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 4px 8px rgba(0,0,0,.35);

            transition:
                transform .15s ease,
                filter .15s ease;
        }

        .check-button:hover {
            filter: brightness(1.08);

            transform:
                translateY(-2px);
        }

        .check-button:active {
            transform:
                scale(.97);
        }

        /* =========================
           LINK
        ========================= */

        .links {
            margin-top: 27px;

            display: flex;

            justify-content: center;

            gap: 30px;
        }

        .links a {
            color: #ffe16a;

            font-size: 16px;

            font-weight: 800;

            text-decoration: none;
        }

        .links a:hover {
            text-decoration: underline;
        }

        /* =========================
           SOCIAL
        ========================= */

        .social {
            margin-top: 27px;

            display: flex;

            align-items: center;
            justify-content: center;

            gap: 13px;

            color: #ffe16a;

            font-size: 17px;

            font-weight: 700;
        }

        .social-icon {
            width: 35px;
            height: 35px;

            border-radius: 50%;

            display: flex;

            align-items: center;
            justify-content: center;

            text-decoration: none;

            color: white;

            font-weight: bold;

            font-size: 18px;
        }

        .telegram {
            background: #39aee5;
        }

        .facebook {
            background: #1877f2;
        }

        /* =========================
           FOOTER LINE
        ========================= */

        .bottom-line {
            width: 100%;
            height: 3px;

            background: #e5c447;

            margin-top: 18px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .header {
                height: 195px;

                padding-bottom: 25px;
            }

            .logo {
                width: 285px;
            }

            .content {
                padding:
                    108px 22px 38px;
            }

            .event-title {
                font-size: 23px;
            }

            .label {
                font-size: 19px;
            }

            .username {
                height: 61px;

                font-size: 18px;
            }

            .notice {
                width: calc(100% + 44px);

                margin-left: -22px;
            }

            .check-button {
                width: 275px;

                height: 64px;

                font-size: 21px;
            }
        }

        /* =========================
           ĐIỆN THOẠI NHỎ
        ========================= */

        @media (max-width: 400px) {

            .content {
                padding-left: 22px;
                padding-right: 22px;
            }

            .event-title {
                font-size: 20px;

                white-space: normal;

                line-height: 28px;
            }

            .links {
                gap: 18px;
            }

            .links a {
                font-size: 15px;
            }
        }
    </style>
</head>


<body>

<div class="page">

    <!-- =========================
         LOGO
    ========================== -->

    <header class="header">

        <!--
        Đặt logo của bạn vào cùng thư mục
        và đổi tên thành logo.png
        -->

        <img
            src="logo.png"
            class="logo"
            alt="Logo sự kiện"
        >

    </header>


    <!-- =========================
         NỘI DUNG
    ========================== -->

    <main class="content">

        <!-- TIÊU ĐỀ -->

        <div class="event-title">

            ĐẠI TIỆC THÁNG 8 KM 20% GIÁ TRỊ!

        </div>


        <!-- LABEL -->

        <div class="label">

            Tên tài khoản:

        </div>


        <!-- INPUT -->

        <input
            id="username"
            class="username"
            type="text"
            placeholder="Nhập tên người dùng"
            autocomplete="off"
        >


        <!-- THÔNG BÁO -->

        <div class="notice">

            <div class="notice-icon">
                ✓
            </div>

            <div class="notice-text">
                Đã sẵn sàng
            </div>

            <div class="notice-right">

                <strong>THÔNG BÁO</strong>

                <br>

                Privacy - Terms

            </div>

        </div>


        <!-- NÚT -->

        <button
            class="check-button"
            onclick="checkAccount()"
        >

            KIỂM TRA NGAY

        </button>


        <!-- LINK -->

        <div class="links">

            <a href="#">
                Thông tin chương trình &gt;
            </a>

            <a href="#">
                Trang phát code &gt;
            </a>

        </div>


        <!-- SOCIAL -->

        <div class="social">

            <span>
                Theo dõi thêm:
            </span>

            <a
                href="#"
                class="social-icon telegram"
            >
                ✈
            </a>

            <a
                href="#"
                class="social-icon facebook"
            >
                f
            </a>

        </div>

    </main>


    <!-- FOOTER -->

    <div class="bottom-line"></div>

</div>


<script>

function checkAccount() {

    const username =
        document
        .getElementById("username")
        .value
        .trim();

    if (!username) {

        alert(
            "Vui lòng nhập tên người dùng."
        );

        return;
    }

    /*
       Đây là xử lý giao diện mẫu.
       Nếu có backend/API thật,
       bạn có thể gửi username tới
       server để kiểm tra.
    */

    alert(
        "Đã nhận tên người dùng: "
        + username
    );
}

</script>

</body>
</html>

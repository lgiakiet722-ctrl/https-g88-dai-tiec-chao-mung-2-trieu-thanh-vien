<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Đại Tiệc Chào Mừng 2 Triệu Thành Viên</title>

<style>
/* =========================
   RESET
========================= */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(
        to bottom,
        #033d3b 0px,
        #08786f 380px,
        #08786f 100%
    );
    color: white;
    overflow-x: hidden;
}

/* =========================
   KHUNG CHÍNH
========================= */
.page {
    width: 100%;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 30px;
}

.container {
    width: 100%;
    max-width: 1100px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 80px;
}

/* =========================
   PHẦN HÌNH ẢNH BÊN TRÁI
========================= */
.left {
    width: 50%;
    text-align: center;
    position: relative;
}

.left img {
    display: block;
    margin: 0 auto;
}

.event-image {
    width: 430px;
    max-width: 100%;
}

.reward-image {
    width: 260px;
    max-width: 80%;
    margin-top: -70px !important;
}

/* =========================
   FORM BÊN PHẢI
========================= */
.right {
    width: 420px;
    max-width: 100%;
    position: relative;
}

.logo-top {
    width: 250px;
    max-width: 70%;
    display: block;
    margin: 0 auto -25px auto;
    position: relative;
    z-index: 2;
}

.card {
    width: 100%;
    border: 2px solid #f7bd00;
    border-radius: 20px;
    padding: 65px 28px 30px;
    background: rgba(0, 100, 90, 0.15);
    text-align: center;
}

/* =========================
   TIÊU ĐỀ
========================= */
.event {
    width: 100%;
    min-height: 62px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 2px solid #f7bd00;
    border-radius: 40px;

    padding: 10px 15px;

    color: #ffd21a;
    font-size: 21px;
    line-height: 1.25;
    font-weight: bold;

    margin-bottom: 30px;
}

/* =========================
   LABEL
========================= */
.label {
    color: #ffd21a;
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 12px;
}

/* =========================
   INPUT
========================= */
.username {
    width: 100%;
    height: 62px;

    border: 2px solid #f7bd00;
    border-radius: 40px;

    background: white;
    color: #222;

    font-size: 18px;
    text-align: center;

    padding: 0 20px;
    outline: none;
}

.username::placeholder {
    color: #999;
}

.username:focus {
    border-color: #ffd21a;
}

/* =========================
   NÚT KIỂM TRA
========================= */
.check {
    display: block;

    margin: 28px auto 0;

    min-width: 275px;
    height: 65px;

    padding: 0 30px;

    border: 2px solid white;
    border-radius: 40px;

    background: #19b9c7;
    color: white;

    font-size: 21px;
    font-weight: bold;

    cursor: pointer;

    box-shadow: 0 4px 10px rgba(0,0,0,0.25);

    transition: 0.2s;
}

.check:hover {
    transform: translateY(-2px);
    filter: brightness(1.05);
}

.check:active {
    transform: scale(0.97);
}

/* =========================
   THÔNG BÁO
========================= */
.message {
    width: 100%;
    min-height: 60px;

    display: none;
    align-items: center;
    justify-content: center;

    margin-top: 25px;

    padding: 12px;

    background: white;
    color: #222;

    border-radius: 5px;

    font-size: 16px;
}

/* =========================
   LINK
========================= */
.links {
    width: 100%;

    display: flex;
    justify-content: space-between;
    align-items: center;

    gap: 20px;

    margin-top: 25px;
}

.links a {
    color: #ffd21a;
    font-size: 16px;
    font-weight: bold;
    text-decoration: none;
    white-space: nowrap;
}

.links a:hover {
    text-decoration: underline;
}

/* =========================
   THEO DÕI
========================= */
.follow {
    margin-top: 25px;

    color: white;
    font-size: 16px;
    font-weight: bold;
}

.social {
    display: inline-flex;
    gap: 10px;
    margin-left: 8px;
    vertical-align: middle;
}

.social a {
    width: 34px;
    height: 34px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: #168de2;
    border-radius: 50%;

    color: white;
    text-decoration: none;

    font-size: 16px;
}

/* =========================
   TABLET
========================= */
@media (max-width: 900px) {

    .page {
        padding: 25px;
    }

    .container {
        gap: 35px;
    }

    .left {
        width: 45%;
    }

    .right {
        width: 400px;
    }

    .event-image {
        width: 380px;
    }

    .reward-image {
        width: 230px;
    }
}

/* =========================
   ĐIỆN THOẠI
========================= */
@media (max-width: 700px) {

    html,
    body {
        width: 100%;
        min-height: 100%;
    }

    body {
        background:
            linear-gradient(
                to bottom,
                #033d3b 0px,
                #08786f 380px,
                #08786f 100%
            );
    }

    .page {
        width: 100%;
        min-height: 100vh;

        padding: 0;

        display: block;
    }

    .container {
        width: 100%;

        display: block;

        margin: 0;
        padding: 0;
    }

    /* ẨN PHẦN HÌNH BÊN TRÁI TRÊN ĐIỆN THOẠI */
    .left {
        display: none;
    }

    .right {
        width: 100%;
        max-width: none;
        margin: 0;
        padding: 0;
    }

    /* LOGO */
    .logo-top {
        display: block;

        width: 300px;
        max-width: 75%;

        margin: 0 auto -5px auto;
    }

    /* KHUNG FORM */
    .card {
        width: 100%;

        min-height: 640px;

        border-left: none;
        border-right: none;

        border-top: 2px solid #f7bd00;
        border-bottom: 2px solid #f7bd00;

        border-radius: 0;

        padding: 90px 20px 30px;

        background: #08786f;
    }

    /* TIÊU ĐỀ */
    .event {
        width: 100%;

        min-height: 60px;

        border-radius: 40px;

        font-size: 18px;

        padding: 10px 18px;

        margin-bottom: 40px;
    }

    /* LABEL */
    .label {
        font-size: 18px;
        margin-bottom: 14px;
    }

    /* INPUT */
    .username {
        width: 100%;
        height: 58px;

        font-size: 17px;

        border-radius: 40px;
    }

    /* NÚT */
    .check {
        min-width: 250px;
        width: auto;

        height: 60px;

        font-size: 19px;

        margin-top: 28px;
    }

    /* LINK */
    .links {
        justify-content: center;

        gap: 25px;

        margin-top: 25px;
    }

    .links a {
        font-size: 14px;
    }

    /* THEO DÕI */
    .follow {
        margin-top: 25px;
        font-size: 16px;
    }

    /* THÔNG BÁO */
    .message {
        min-height: 60px;

        font-size: 16px;

        margin-top: 25px;
    }
}

/* =========================
   ĐIỆN THOẠI NHỎ
========================= */
@media (max-width: 400px) {

    .card {
        padding-left: 15px;
        padding-right: 15px;
    }

    .event {
        font-size: 17px;
    }

    .username {
        height: 56px;
        font-size: 16px;
    }

    .check {
        min-width: 250px;
        height: 58px;
        font-size: 18px;
    }

    .links {
        gap: 15px;
    }

    .links a {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="container">

        <!-- =========================
             PHẦN TRÁI - MÁY TÍNH
        ========================== -->
        <div class="left">

            <!-- ẢNH SỰ KIỆN -->
            <img
                src="event.png"
                class="event-image"
                alt="Đại tiệc 2 triệu thành viên"
                onerror="this.style.display='none'"
            >

            <!-- ẢNH PHẦN THƯỞNG -->
            <img
                src="reward.png"
                class="reward-image"
                alt="Phần thưởng"
                onerror="this.style.display='none'"
            >

        </div>


        <!-- =========================
             FORM
        ========================== -->
        <div class="right">

            <!-- LOGO -->
            <img
                src="logo.png"
                class="logo-top"
                alt="Logo"
                onerror="this.style.display='none'"
            >

            <div class="card">

                <!-- TIÊU ĐỀ -->
                <div class="event">
                    ĐẠI TIỆC THÁNG 8 KM 20% GIÁ TRỊ!
                </div>

                <!-- LABEL -->
                <div class="label">
                    Tên tài khoản:
                </div>

                <!-- USERNAME -->
                <input
                    type="text"
                    id="username"
                    class="username"
                    placeholder="Nhập tên người dùng"
                    autocomplete="off"
                >

                <!-- THÔNG BÁO -->
                <div
                    id="message"
                    class="message"
                >
                    <span>✔️</span>
                    <span style="margin-left:10px;">
                        Thành công!
                    </span>
                </div>

                <!-- BUTTON -->
                <button
                    type="button"
                    class="check"
                    onclick="kiemTra()"
                >
                    KIỂM TRA NGAY
                </button>

                <!-- LINK -->
                <div class="links">

                    <a href="#">
                        Thông tin chương trình &gt;
                    </a>

                    <a href="#">
                        Trang phát code &gt;
                    </a>

                </div>

                <!-- SOCIAL -->
                <div class="follow">

                    Theo dõi thêm:

                    <span class="social">

                        <a href="#" title="Telegram">
                            ➤
                        </a>

                        <a href="#" title="Facebook">
                            f
                        </a>

                    </span>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

/* =========================
   KIỂM TRA TÊN TÀI KHOẢN
========================= */

function kiemTra() {

    const username =
        document.getElementById("username").value.trim();

    const message =
        document.getElementById("message");

    if (username === "") {

        alert("Vui lòng nhập tên người dùng!");

        return;
    }

    /*
       Hiển thị thông báo thành công
    */
    message.style.display = "flex";

    /*
       Lưu tên tài khoản
    */
    localStorage.setItem(
        "username",
        username
    );

    /*
       Nếu bạn muốn chuyển sang trang thanh toán,
       bỏ dấu // ở dòng dưới:

       window.location.href = "thanhtoan.html";
    */
}


/* =========================
   NHẤN ENTER
========================= */

document
    .getElementById("username")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            kiemTra();

        }

    });


/* =========================
   KHÔI PHỤC TÊN ĐÃ NHẬP
========================= */

window.addEventListener("load", function() {

    const oldUsername =
        localStorage.getItem("username");

    if (oldUsername) {

        document.getElementById("username").value =
            oldUsername;

    }

});

</script>

</body>
</html>

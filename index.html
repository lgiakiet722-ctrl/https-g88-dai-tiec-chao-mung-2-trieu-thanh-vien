<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Đại tiệc chào mừng</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #07847d;
    color: #fff;
}

.container {
    width: 100%;
    max-width: 600px;
    margin: auto;
    padding: 25px 20px 60px;
    text-align: center;
}

.title {
    font-size: 42px;
    line-height: 1.15;
    font-weight: 900;
    color: #ffd400;
    margin: 10px 0 25px;
}

.box {
    border: 3px solid #ffd400;
    padding: 35px 25px;
}

.promo {
    border: 3px solid #ffd400;
    border-radius: 60px;
    padding: 25px 15px;
    font-size: 27px;
    font-weight: bold;
    color: #ffd400;
    margin-bottom: 50px;
}

.label {
    font-size: 25px;
    font-weight: bold;
    color: #ffd400;
    margin-bottom: 20px;
}

input {
    width: 100%;
    height: 80px;
    border-radius: 50px;
    border: 4px solid #ffd400;
    background: #fff;
    text-align: center;
    font-size: 25px;
    font-weight: bold;
    outline: none;
    color: #222;
    padding: 10px 20px;
}

button {
    width: 100%;
    height: 80px;
    margin-top: 35px;
    border-radius: 50px;
    border: 4px solid white;
    background: #2aaec3;
    color: white;
    font-size: 27px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 8px 15px rgba(0,0,0,0.25);
}

button:active {
    transform: scale(0.98);
}

.links {
    display: flex;
    justify-content: space-between;
    margin-top: 35px;
    color: #ffd400;
    font-size: 18px;
    font-weight: bold;
}

.follow {
    margin-top: 45px;
    font-size: 23px;
    font-weight: bold;
}

.social {
    margin-top: 20px;
}

.social span {
    display: inline-flex;
    width: 65px;
    height: 65px;
    margin: 0 8px;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: #159de0;
    font-size: 28px;
    font-weight: bold;
}

.error {
    color: #ffdddd;
    font-size: 17px;
    margin-top: 12px;
    display: none;
}

@media (max-width: 500px) {
    .title {
        font-size: 38px;
    }

    .promo {
        font-size: 23px;
    }

    .label {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="title">
        ĐẠI TIỆC CHÀO<br>
        MỪNG<br>
        2 TRIỆU THÀNH VIÊN
    </div>

    <div class="box">

        <div class="promo">
            ĐẠI TIỆC THÁNG 8 KM 20% GIÁ TRỊ!
        </div>

        <div class="label">
            Tên tài khoản:
        </div>

        <input
            type="text"
            id="username"
            placeholder="Nhập tên tài khoản"
            autocomplete="off"
        >

        <div id="error" class="error">
            Vui lòng nhập tên tài khoản.
        </div>

        <button onclick="checkAccount()">
            KIỂM TRA NGAY
        </button>

        <div class="links">
            <span>Thông tin chương trình &gt;</span>
            <span>Trang phát code &gt;</span>
        </div>

        <div class="follow">
            Theo dõi thêm:
        </div>

        <div class="social">
            <span>➤</span>
            <span>f</span>
        </div>

    </div>

</div>

<script>
function checkAccount() {

    const username = document
        .getElementById("username")
        .value
        .trim();

    const error = document.getElementById("error");

    if (username === "") {
        error.style.display = "block";
        return;
    }

    error.style.display = "none";

    /*
      Không dùng localStorage.
      Tên chỉ được truyền sang trang thanh toán
      thông qua URL.
    */

    const url =
        "thanhtoan.html?user=" +
        encodeURIComponent(username);

    window.location.href = url;
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <!-- MOBILE -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Đại Tiệc Chào Mừng 2 Triệu Thành Viên</title>

    <style>
        /* =====================================================
           RESET
        ===================================================== */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                linear-gradient(
                    180deg,
                    #063d3b 0%,
                    #08786f 45%,
                    #08786f 100%
                );
            color: #ffffff;
            overflow-x: hidden;
        }

        button,
        input {
            font-family: inherit;
        }

        a {
            text-decoration: none;
        }


        /* =====================================================
           TRANG CHÍNH
        ===================================================== */
        .page {
            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 30px;
        }


        /* =====================================================
           KHỐI CHÍNH
        ===================================================== */
        .main-wrapper {
            width: 100%;
            max-width: 1050px;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 70px;
        }


        /* =====================================================
           KHU VỰC LOGO
        ===================================================== */
        .logo-section {
            width: 500px;

            display: flex;
            justify-content: center;
            align-items: center;

            flex-shrink: 0;
        }

        .logo {
            display: block;

            width: 500px;
            max-width: 100%;

            height: auto;

            object-fit: contain;
        }


        /* =====================================================
           FORM
        ===================================================== */
        .card {
            width: 480px;
            max-width: 100%;

            min-height: 430px;

            border: 2px solid #f7bd00;
            border-radius: 22px;

            padding: 70px 35px 35px;

            background: rgba(8, 120, 111, 0.55);

            display: flex;
            flex-direction: column;
            align-items: center;

            position: relative;

            box-shadow:
                0 8px 30px rgba(0, 0, 0, 0.12);
        }


        /* =====================================================
           TIÊU ĐỀ CHƯƠNG TRÌNH
        ===================================================== */
        .event {
            width: 100%;
            min-height: 62px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 2px solid #f7bd00;
            border-radius: 40px;

            padding: 12px 18px;

            color: #ffdb21;

            font-size: 21px;
            line-height: 1.25;

            font-weight: 800;

            text-align: center;

            margin-bottom: 32px;
        }


        /* =====================================================
           LABEL
        ===================================================== */
        .label {
            width: 100%;

            text-align: center;

            color: #ffdb21;

            font-size: 18px;

            font-weight: 700;

            margin-bottom: 12px;
        }


        /* =====================================================
           INPUT
        ===================================================== */
        .username {
            width: 100%;
            height: 62px;

            border: 2px solid #f7bd00;
            border-radius: 40px;

            background: #ffffff;

            color: #222222;

            font-size: 18px;

            text-align: center;

            padding: 0 20px;

            outline: none;

            margin-bottom: 18px;
        }

        .username::placeholder {
            color: #999999;
        }

        .username:focus {
            border-color: #ffd629;

            box-shadow:
                0 0 0 3px rgba(247, 189, 0, 0.15);
        }


        /* =====================================================
           THÔNG BÁO
        ===================================================== */
        .message {
            width: 100%;
            min-height: 60px;

            background: #ffffff;

            color: #333333;

            border-radius: 5px;

            display: none;

            align-items: center;

            padding: 10px 15px;

            margin-bottom: 24px;

            font-size: 17px;
        }

        .message.show {
            display: flex;
        }

        .check-icon {
            width: 25px;
            height: 25px;

            border-radius: 50%;

            background: #2bb45b;

            color: #ffffff;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 17px;
            font-weight: bold;

            flex-shrink: 0;

            margin-right: 10px;
        }


        /* =====================================================
           BUTTON
        ===================================================== */
        .check {
            min-width: 275px;
            height: 62px;

            padding: 0 30px;

            border: 2px solid #ffffff;
            border-radius: 40px;

            background: #20b8c7;

            color: #ffffff;

            font-size: 19px;

            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 5px 12px rgba(0, 0, 0, 0.25);

            transition:
                transform 0.15s ease,
                background 0.15s ease;
        }

        .check:hover {
            background: #28c5d4;
            transform: translateY(-2px);
        }

        .check:active {
            transform: scale(0.97);
        }


        /* =====================================================
           LINK
        ===================================================== */
        .links {
            width: 100%;

            display: flex;

            justify-content: center;
            align-items: center;

            gap: 35px;

            margin-top: 28px;
        }

        .links a {
            color: #ffdb21;

            font-size: 16px;

            font-weight: 700;

            white-space: nowrap;
        }

        .links a:hover {
            text-decoration: underline;
        }


        /* =====================================================
           SOCIAL
        ===================================================== */
        .follow {
            margin-top: 18px;

            display: flex;

            justify-content: center;
            align-items: center;

            gap: 10px;

            color: #ffffff;

            font-size: 15px;

            font-weight: 700;
        }

        .social {
            width: 34px;
            height: 34px;

            border-radius: 50%;

            background: #168ed2;

            display: inline-flex;

            justify-content: center;
            align-items: center;

            color: #ffffff;

            font-size: 17px;

            font-weight: 700;
        }


        /* =====================================================
           LOGO LỖI
        ===================================================== */
        .logo-error {
            width: 100%;

            color: #ffdb21;

            text-align: center;

            font-size: 14px;

            display: none;
        }


        /* =====================================================
           TABLET
        ===================================================== */
        @media (max-width: 950px) {

            .page {
                padding: 30px 20px;
            }

            .main-wrapper {
                gap: 35px;
            }

            .logo-section {
                width: 430px;
            }

            .card {
                width: 430px;
                padding-left: 28px;
                padding-right: 28px;
            }

            .event {
                font-size: 19px;
            }
        }


        /* =====================================================
           MOBILE
        ===================================================== */
        @media (max-width: 700px) {

            html,
            body {
                min-height: 100%;
            }

            body {
                background:
                    linear-gradient(
                        180deg,
                        #063d3b 0,
                        #08786f 140px,
                        #08786f 100%
                    );
            }

            .page {
                min-height: 100vh;

                display: block;

                padding: 0 20px 50px;
            }

            .main-wrapper {
                width: 100%;

                display: flex;

                flex-direction: column;

                align-items: center;

                gap: 0;
            }


            /* -----------------------------
               LOGO MOBILE
            ----------------------------- */
            .logo-section {
                width: 100%;

                display: flex;

                justify-content: center;
                align-items: center;

                padding-top: 35px;

                padding-bottom: 10px;
            }

            .logo {
                width: 360px;
                max-width: 100%;
            }


            /* -----------------------------
               FORM MOBILE
            ----------------------------- */
            .card {
                width: 100%;
                max-width: 550px;

                min-height: auto;

                border-radius: 0;

                border-left: 2px solid #f7bd00;
                border-right: 2px solid #f7bd00;

                border-top: 2px solid #f7bd00;
                border-bottom: 2px solid #f7bd00;

                padding: 35px 28px 35px;

                background: rgba(8, 120, 111, 0.72);

                box-shadow: none;
            }


            /* -----------------------------
               EVENT MOBILE
            ----------------------------- */
            .event {
                min-height: 75px;

                font-size: 21px;

                line-height: 1.25;

                margin-bottom: 48px;

                padding: 12px 20px;
            }


            /* -----------------------------
               LABEL MOBILE
            ----------------------------- */
            .label {
                font-size: 21px;

                margin-bottom: 17px;
            }


            /* -----------------------------
               INPUT MOBILE
            ----------------------------- */
            .username {
                width: 100%;

                height: 62px;

                font-size: 19px;

                margin-bottom: 26px;
            }


            /* -----------------------------
               MESSAGE MOBILE
            ----------------------------- */
            .message {
                min-height: 80px;

                font-size: 20px;

                padding: 12px 18px;

                margin-bottom: 28px;
            }

            .check-icon {
                width: 42px;
                height: 42px;

                font-size: 26px;

                margin-right: 14px;
            }


            /* -----------------------------
               BUTTON MOBILE
            ----------------------------- */
            .check {
                width: 90%;

                min-width: 0;

                height: 70px;

                font-size: 22px;
            }


            /* -----------------------------
               LINK MOBILE
            ----------------------------- */
            .links {
                gap: 24px;

                margin-top: 35px;
            }

            .links a {
                font-size: 16px;
            }


            /* -----------------------------
               SOCIAL MOBILE
            ----------------------------- */
            .follow {
                margin-top: 30px;

                font-size: 18px;
            }

            .social {
                width: 45px;
                height: 45px;

                font-size: 20px;
            }
        }


        /* =====================================================
           ĐIỆN THOẠI NHỎ
        ===================================================== */
        @media (max-width: 400px) {

            .page {
                padding-left: 15px;
                padding-right: 15px;
            }

            .logo-section {
                padding-top: 25px;
            }

            .logo {
                width: 320px;
            }

            .card {
                padding-left: 20px;
                padding-right: 20px;
            }

            .event {
                font-size: 18px;

                min-height: 70px;
            }

            .label {
                font-size: 19px;
            }

            .username {
                font-size: 17px;
            }

            .check {
                width: 92%;
                height: 65px;

                font-size: 20px;
            }

            .links {
                gap: 15px;
            }

            .links a {
                font-size: 14px;
            }
        }
    </style>
</head>


<body>

    <main class="page">

        <div class="main-wrapper">


            <!-- =================================================
                 LOGO
            ================================================== -->
            <section class="logo-section">

                <img
                    src="./4387413a-ea82-4d2e-8f1b-b04ddb2ec70b1.png"
                    alt="Đại tiệc chào mừng 2 triệu thành viên"
                    class="logo"
                    id="mainLogo"
                >

                <div class="logo-error" id="logoError">
                    Không thể tải logo.
                </div>

            </section>


            <!-- =================================================
                 FORM
            ================================================== -->
            <section class="card">


                <!-- TIÊU ĐỀ -->
                <div class="event">
                    ĐẠI TIỆC THÁNG 8 KM 20% GIÁ TRỊ!
                </div>


                <!-- LABEL -->
                <label
                    class="label"
                    for="username"
                >
                    Tên tài khoản:
                </label>


                <!-- USERNAME -->
                <input
                    type="text"
                    id="username"
                    class="username"
                    placeholder="Nhập tên người dùng"
                    autocomplete="off"
                    spellcheck="false"
                >


                <!-- THÔNG BÁO -->
                <div
                    id="message"
                    class="message"
                    aria-live="polite"
                >

                    <span class="check-icon">
                        ✓
                    </span>

                    <span id="messageText">
                        Đã xác thực
                    </span>

                </div>


                <!-- BUTTON -->
                <button
                    type="button"
                    class="check"
                    id="checkButton"
                >
                    KIỂM TRA NGAY
                </button>


                <!-- LINKS -->
                <div class="links">

                    <a href="#">
                        Thông tin chương trình &gt;
                    </a>

                    <a href="thanhtoan.html">
                        Trang phát code &gt;
                    </a>

                </div>


                <!-- SOCIAL -->
                <div class="follow">

                    <span>
                        Theo dõi thêm:
                    </span>

                    <a
                        href="#"
                        class="social"
                        aria-label="Telegram"
                    >
                        ➤
                    </a>

                    <a
                        href="#"
                        class="social"
                        aria-label="Facebook"
                    >
                        f
                    </a>

                </div>

            </section>

        </div>

    </main>


    <script>

        /* =====================================================
           LẤY PHẦN TỬ
        ===================================================== */

        const usernameInput =
            document.getElementById("username");

        const message =
            document.getElementById("message");

        const messageText =
            document.getElementById("messageText");

        const checkButton =
            document.getElementById("checkButton");

        const mainLogo =
            document.getElementById("mainLogo");

        const logoError =
            document.getElementById("logoError");


        /* =====================================================
           KIỂM TRA LOGO
        ===================================================== */

        mainLogo.addEventListener("error", function () {

            mainLogo.style.display = "none";

            logoError.style.display = "block";

        });


        /* =====================================================
           NÚT KIỂM TRA
        ===================================================== */

        function kiemTra() {

            const username =
                usernameInput.value.trim();


            /* Không nhập */
            if (username === "") {

                alert(
                    "Vui lòng nhập tên người dùng!"
                );

                usernameInput.focus();

                return;
            }


            /*
             * Hiển thị trạng thái xác thực ở giao diện.
             * Nếu cần xác thực thật với máy chủ, phần này
             * cần kết nối API/backend riêng.
             */

            messageText.textContent =
                "Đã xác thực";

            message.classList.add("show");


            /* Lưu tên người dùng trên trình duyệt */
            try {

                localStorage.setItem(
                    "username",
                    username
                );

            } catch (error) {

                console.log(
                    "Không thể lưu localStorage:",
                    error
                );

            }

        }


        /* =====================================================
           CLICK BUTTON
        ===================================================== */

        checkButton.addEventListener(
            "click",
            kiemTra
        );


        /* =====================================================
           ENTER ĐỂ KIỂM TRA
        ===================================================== */

        usernameInput.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Enter") {

                    event.preventDefault();

                    kiemTra();

                }

            }
        );


        /* =====================================================
           KHÔI PHỤC USERNAME
        ===================================================== */

        try {

            const savedUsername =
                localStorage.getItem("username");

            if (savedUsername) {

                usernameInput.value =
                    savedUsername;

            }

        } catch (error) {

            console.log(
                "Không thể đọc localStorage:",
                error
            );

        }

    </script>

</body>
</html>

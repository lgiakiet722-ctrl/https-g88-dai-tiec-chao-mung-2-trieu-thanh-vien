<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Đại tiệc chào mừng 2 triệu thành viên</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: #0d8278;
    color: #ffffff;
}

/* ===== TRANG ===== */
.page {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
}

/* ===== BỐ CỤC PC ===== */
.container {
    width: min(1100px, 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 55px;
}

/* ===== LOGO ===== */
.logo-area {
    width: 52%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.logo {
    display: block;
    width: 100%;
    max-width: 650px;
    height: auto;
    object-fit: contain;
}

/* ===== FORM ===== */
.card {
    width: 430px;
    max-width: 100%;
    border: 3px solid #ffc400;
    border-radius: 20px;
    padding: 38px 35px;
    background: #0d8278;
    text-align: center;
}

/* Tiêu đề chương trình */
.event {
    border: 3px solid #ffc400;
    border-radius: 60px;
    padding: 20px 18px;
    color: #ffc400;
    font-size: 25px;
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 42px;
}

/* Label */
.label {
    display: block;
    color: #ffc400;
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 16px;
}

/* Input */
.username {
    width: 100%;
    height: 64px;
    border: 3px solid #ffc400;
    border-radius: 40px;
    padding: 0 25px;
    font-size: 20px;
    text-align: center;
    outline: none;
    background: #ffffff;
    color: #222222;
}

.username:focus {
    border-color: #ffffff;
}

/* Thông báo */
.message {
    display: none;
    width: 100%;
    min-height: 70px;
    margin-top: 22px;
    background: #ffffff;
    border-radius: 8px;
    color: #333333;
    align-items: center;
    justify-content: center;
    gap: 12px;
    font-size: 20px;
}

.message.show {
    display: flex;
}

.checkmark {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #2dbb67;
    color: white;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    font-size: 25px;
}

/* Nút */
.check {
    width: 100%;
    height: 64px;
    margin-top: 22px;
    border: 3px solid #ffffff;
    border-radius: 40px;
    background: #27b5c5;
    color: #ffffff;
    font-size: 24px;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 4px 8px rgba(0,0,0,.25);
}

.check:hover {
    background: #20a7b6;
}

.check:active {
    transform: scale(.98);
}

/* Links */
.links {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    margin-top: 30px;
}

.links a {
    color: #ffc400;
    text-decoration: none;
    font-size: 17px;
    font-weight: bold;
}

.links a:hover {
    text-decoration: underline;
}

/* Theo dõi */
.follow {
    margin-top: 28px;
    font-size: 18px;
    font-weight: bold;
}

.social {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 12px;
}

.social a {
    width: 45px;
    height: 45px;
    border-radius: 50%;
    background: #159ddd;
    color: #ffffff;
    text-decoration: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
}

/* ===== MOBILE ===== */
@media (max-width: 768px) {

    .page {
        padding: 20px 15px 40px;
        align-items: flex-start;
    }

    .container {
        width: 100%;
        flex-direction: column;
        gap: 15px;
    }

    .logo-area {
        width: 100%;
    }

    .logo {
        width: 90%;
        max-width: 500px;
    }

    .card {
        width: 100%;
        max-width: 500px;
        padding: 28px 20px;
        border-radius: 0;
        border-width: 2px;
    }

    .event {
        font-size: 21px;
        padding: 17px 12px;
        margin-bottom: 35px;
    }

    .label {
        font-size: 20px;
    }

    .username {
        height: 60px;
        font-size: 18px;
    }

    .check {
        height: 60px;
        font-size: 21px;
    }

    .message {
        font-size: 18px;
    }

    .links a {
        font-size: 15px;
    }
}

/* ===== IPHONE ===== */
@media (max-width: 430px) {

    .page {
        padding: 10px 10px 30px;
    }

    .container {
        gap: 5px;
    }

    .logo {
        width: 95%;
    }

    .card {
        padding: 25px 15px;
    }

    .event {
        font-size: 19px;
    }

    .label {
        font-size: 19px;
    }

    .links {
        gap: 8px;
    }

    .links a {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="container">

        <!-- LOGO -->
        <div class="logo-area">

            <img
                id="logo"
                class="logo"
                src="4387413a-ea82-4d2e-8f1b-b04ddb2ec70b1.png"
                alt="Đại tiệc chào mừng 2 triệu thành viên"
                onerror="showLogoError()"
            >

        </div>


        <!-- FORM -->
        <div class="card">

            <div class="event">
                ĐẠI TIỆC THÁNG 8 KM 20% GIÁ TRỊ!
            </div>

            <label class="label" for="username">
                Tên tài khoản:
            </label>

            <input
                id="username"
                class="username"
                type="text"
                placeholder="Nhập tên người dùng"
                autocomplete="off"
                spellcheck="false"
            >

            <div id="message" class="message">

                <span class="checkmark">✓</span>

                <span>Đã xác thực</span>

            </div>

            <button
                id="checkButton"
                class="check"
                type="button"
            >
                KIỂM TRA NGAY
            </button>

            <div class="links">

                <a href="#">
                    Thông tin chương trình &gt;
                </a>

                <a href="thanhtoan.html">
                    Trang phát code &gt;
                </a>

            </div>

            <div class="follow">

                Theo dõi thêm:

                <div class="social">

                    <a href="#" aria-label="Telegram">
                        ➤
                    </a>

                    <a href="#" aria-label="Facebook">
                        f
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>


<script>

/*
=================================================
LƯU TÊN TÀI KHOẢN
=================================================
*/

const usernameInput = document.getElementById("username");
const message = document.getElementById("message");
const checkButton = document.getElementById("checkButton");


/*
=================================================
KHI BẤM KIỂM TRA NGAY
=================================================
*/

checkButton.addEventListener("click", function () {

    const username = usernameInput.value.trim();

    if (username === "") {

        alert("Vui lòng nhập tên tài khoản.");

        usernameInput.focus();

        return;
    }


    /*
    Lưu chính xác tên người dùng
    vào localStorage.
    */

    localStorage.setItem(
        "gameAccount",
        username
    );


    /*
    Hiện Đã xác thực
    */

    message.classList.add("show");


    /*
    Chuyển sang thanhtoan.html
    sau một khoảng ngắn.
    */

    setTimeout(function () {

        window.location.href = "thanhtoan.html";

    }, 500);

});


/*
=================================================
CHO PHÉP NHẤN ENTER
=================================================
*/

usernameInput.addEventListener("keydown", function (event) {

    if (event.key === "Enter") {

        checkButton.click();

    }

});


/*
=================================================
NẾU LOGO KHÔNG TẢI ĐƯỢC
=================================================
*/

function showLogoError() {

    const logo = document.getElementById("logo");

    logo.style.display = "none";

    const logoArea = document.querySelector(".logo-area");

    logoArea.innerHTML = `
        <div style="
            color:#ffc400;
            font-size:28px;
            font-weight:900;
            text-align:center;
            line-height:1.3;
        ">
            ĐẠI TIỆC CHÀO MỪNG<br>
            2 TRIỆU THÀNH VIÊN
        </div>
    `;

}

</script>

</body>
</html>

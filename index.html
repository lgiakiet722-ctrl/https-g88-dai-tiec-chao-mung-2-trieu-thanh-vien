<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>Đại tiệc chào mừng 2 triệu thành viên</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: #087d73;
            color: #ffd21c;
        }

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .container {
            width: min(1100px, 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
        }

        /* ================= LOGO ================= */

        .logo-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo {
            display: block;
            width: min(520px, 100%);
            height: auto;
            object-fit: contain;
        }

        .logo-fallback {
            display: none;
            text-align: center;
            font-size: 42px;
            font-weight: 900;
            line-height: 1.05;
            color: #ffd21c;
            text-shadow:
                2px 2px 0 #8b2800,
                4px 4px 0 #ff5a00;
        }

        /* ================= FORM ================= */

        .card {
            width: 100%;
            max-width: 520px;
            border: 3px solid #f7c91c;
            border-radius: 18px;
            padding: 38px 35px;
            background: #087d73;
            box-shadow: 0 10px 35px rgba(0, 0, 0, .12);
        }

        .event {
            border: 3px solid #f7c91c;
            border-radius: 60px;
            padding: 20px 25px;
            text-align: center;
            font-size: 27px;
            line-height: 1.25;
            font-weight: 800;
            margin-bottom: 45px;
        }

        .label {
            display: block;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .username {
            width: 100%;
            height: 64px;
            border: 3px solid #f7c91c;
            border-radius: 40px;
            background: white;
            color: #333;
            text-align: center;
            font-size: 21px;
            outline: none;
            padding: 0 20px;
        }

        .username::placeholder {
            color: #999;
        }

        .username:focus {
            box-shadow: 0 0 0 4px rgba(247, 201, 28, .2);
        }

        /* ================= BUTTON ================= */

        .check {
            width: 100%;
            height: 65px;
            margin-top: 30px;
            border: 3px solid white;
            border-radius: 40px;
            background: #20b5c5;
            color: white;
            font-size: 25px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 5px 12px rgba(0, 0, 0, .2);
        }

        .check:active {
            transform: scale(.98);
        }

        /* ================= MESSAGE ================= */

        .message {
            display: none;
            margin-top: 25px;
            padding: 18px;
            border-radius: 8px;
            background: white;
            color: #333;
            font-size: 20px;
            text-align: center;
        }

        .message.success {
            display: block;
        }

        .checkmark {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 38px;
            height: 38px;
            margin-right: 8px;
            border-radius: 50%;
            background: #2dbb63;
            color: white;
            font-weight: bold;
        }

        /* ================= LINKS ================= */

        .links {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 32px;
        }

        .links a {
            color: #ffd21c;
            text-decoration: none;
            font-weight: 700;
            font-size: 17px;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .follow {
            text-align: center;
            margin-top: 28px;
            color: white;
            font-size: 18px;
            font-weight: 700;
        }

        .social {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 12px;
        }

        .social a {
            width: 45px;
            height: 45px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: #159bd3;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        /* ================= MOBILE ================= */

        @media (max-width: 768px) {

            .page {
                min-height: 100vh;
                padding: 20px 16px 40px;
                align-items: flex-start;
            }

            .container {
                flex-direction: column;
                gap: 10px;
                width: 100%;
            }

            .logo-area {
                width: 100%;
                margin-top: 5px;
            }

            .logo {
                width: min(430px, 92vw);
            }

            .card {
                width: 100%;
                max-width: 540px;
                padding: 38px 22px;
                border-radius: 0;
                border-left: 0;
                border-right: 0;
            }

            .event {
                font-size: 23px;
                padding: 17px 18px;
                margin-bottom: 40px;
            }

            .label {
                font-size: 22px;
            }

            .username {
                height: 62px;
                font-size: 19px;
            }

            .check {
                height: 62px;
                font-size: 23px;
            }

            .links a {
                font-size: 16px;
            }
        }

        @media (max-width: 390px) {

            .event {
                font-size: 20px;
            }

            .card {
                padding-left: 18px;
                padding-right: 18px;
            }

            .links {
                gap: 8px;
            }

            .links a {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="container">

        <!-- LOGO -->
        <div class="logo-area">

            <img
                id="logo"
                class="logo"
                src="./4387413a-ea82-4d2e-8f1b-b04ddb2ec70b1.png"
                alt="Đại tiệc chào mừng 2 triệu thành viên"
                onerror="showLogoError()"
            >

            <div id="logoFallback" class="logo-fallback">
                ĐẠI TIỆC CHÀO MỪNG<br>
                2 TRIỆU THÀNH VIÊN
            </div>

        </div>

        <!-- FORM -->
        <div class="card">

            <div class="event">
                ĐẠI TIỆC THÁNG 8 KM 20% GIÁ TRỊ!
            </div>

            <label
                class="label"
                for="username">
                Tên tài khoản:
            </label>

            <input
                id="username"
                class="username"
                type="text"
                placeholder="Nhập tên người dùng"
                autocomplete="off"
                spellcheck="false"
            >

            <div
                id="message"
                class="message">
                <span class="checkmark">✓</span>
                <span>Đã xác thực</span>
            </div>

            <button
                id="checkButton"
                class="check"
                type="button">
                KIỂM TRA NGAY
            </button>

            <div class="links">

                <a href="#">
                    Thông tin chương trình &gt;
                </a>

                <a href="./thanhtoan.html">
                    Trang phát code &gt;
                </a>

            </div>

            <div class="follow">
                Theo dõi thêm:

                <div class="social">
                    <a href="#" aria-label="Telegram">➤</a>
                    <a href="#" aria-label="Facebook">f</a>
                </div>
            </div>

        </div>

    </div>

</div>

<script>

    const usernameInput =
        document.getElementById("username");

    const message =
        document.getElementById("message");

    const checkButton =
        document.getElementById("checkButton");

    /*
     * Hiển thị logo dự phòng nếu file PNG
     * không tải được.
     */
    function showLogoError() {

        const logo =
            document.getElementById("logo");

        const fallback =
            document.getElementById("logoFallback");

        logo.style.display = "none";
        fallback.style.display = "block";
    }

    /*
     * KIỂM TRA NGAY
     *
     * Không dùng localStorage.
     * Tên chỉ được giữ trong phiên hiện tại.
     */
    checkButton.addEventListener("click", function () {

        const username =
            usernameInput.value.trim();

        if (!username) {

            alert("Vui lòng nhập tên tài khoản.");

            usernameInput.focus();

            return;
        }

        /*
         * Chỉ lưu trong phiên trình duyệt hiện tại,
         * không lưu lâu dài.
         */
        sessionStorage.setItem(
            "gameUsername",
            username
        );

        /*
         * Hiển thị trạng thái xác nhận.
         */
        message.classList.add("success");

        /*
         * Sau khi xác nhận tên,
         * chuyển sang trang thanh toán.
         */
        setTimeout(function () {

            window.location.href = "./thanhtoan.html";

        }, 500);

    });

</script>

</body>
</html>

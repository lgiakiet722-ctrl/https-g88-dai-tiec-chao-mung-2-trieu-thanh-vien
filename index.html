<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <title>Đại Tiệc Chào Mừng</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #063f3b;
            color: #fff;
            min-height: 100vh;
        }

        /* KHUNG CHÍNH */
        .page {
            width: 100%;
            min-height: 100vh;
            background:
                linear-gradient(
                    to bottom,
                    #073f3b 0%,
                    #11766d 32%,
                    #11766d 78%,
                    #063f3b 100%
                );
        }

        /* PHẦN ĐẦU */
        .header {
            height: 195px;
            border-bottom: 3px solid #e9c84a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding-top: 20px;
        }

        .logo {
            width: min(88%, 420px);
            text-align: center;
        }

        .logo-small {
            font-size: 24px;
            font-weight: 900;
            color: #ffd52f;
            text-shadow:
                2px 2px 0 #8d4b00,
                0 0 5px #fff000;
            margin-bottom: -3px;
        }

        .logo-number {
            font-size: 82px;
            line-height: 70px;
            font-weight: 1000;
            font-style: italic;

            background: linear-gradient(
                180deg,
                #dffff4 0%,
                #00e6b4 30%,
                #008f75 55%,
                #004e45 100%
            );

            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;

            -webkit-text-stroke: 3px #e7bd20;

            text-shadow:
                3px 3px 0 #704400,
                0 0 10px #00ffce;
        }

        .logo-text {
            display: inline-block;
            font-size: 30px;
            font-weight: 1000;
            color: #ffe35c;
            border: 3px solid #e5b829;
            border-radius: 8px;
            padding: 3px 12px;
            margin-left: -10px;
            text-shadow: 2px 2px #704400;
        }

        /* NỘI DUNG */
        .content {
            max-width: 650px;
            margin: auto;
            padding: 38px 22px 55px;
            text-align: center;
        }

        /* TIÊU ĐỀ */
        .event-title {
            border: 3px solid #f1d05b;
            border-radius: 40px;

            padding: 12px 20px;
            margin-bottom: 42px;

            color: #ffe06a;
            font-size: 25px;
            font-weight: 900;

            text-shadow: 1px 2px #765d00;

            box-shadow:
                0 3px 8px rgba(0,0,0,0.3),
                inset 0 0 10px rgba(255,255,255,0.05);
        }

        /* LABEL */
        .label {
            font-size: 20px;
            font-weight: 700;
            color: #ffe174;
            margin-bottom: 12px;
        }

        /* Ô INPUT */
        .input-box {
            width: 100%;
            height: 62px;

            border-radius: 40px;
            border: 3px solid #e5bd32;

            background: #fff;

            padding: 0 25px;

            text-align: center;
            font-size: 20px;
            color: #333;

            outline: none;

            box-shadow:
                0 3px 7px rgba(0,0,0,0.25);
        }

        .input-box::placeholder {
            color: #999;
        }

        .input-box:focus {
            border-color: #fff000;
            box-shadow:
                0 0 12px rgba(255,230,0,0.5);
        }

        /* THÔNG BÁO */
        .notice {
            margin-top: 25px;

            width: 100%;
            min-height: 60px;

            background: #fff;
            color: #444;

            border-radius: 3px;

            display: flex;
            align-items: center;

            text-align: left;

            padding: 10px 18px;

            font-size: 17px;
        }

        .check {
            width: 31px;
            height: 31px;

            background: #28b85a;
            color: white;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 21px;
            font-weight: bold;

            margin-right: 14px;
        }

        .cloudflare {
            margin-left: auto;
            text-align: right;
            font-size: 12px;
            color: #888;
        }

        .cloudflare strong {
            color: #f29a45;
            font-size: 14px;
        }

        /* NÚT */
        .button {
            display: inline-flex;

            margin-top: 35px;

            min-width: 275px;
            height: 65px;

            align-items: center;
            justify-content: center;

            border-radius: 40px;

            border: 3px solid #fff;

            background:
                linear-gradient(
                    to bottom,
                    #38c9c0,
                    #079a91
                );

            color: white;

            font-size: 22px;
            font-weight: 1000;

            text-decoration: none;

            cursor: pointer;

            box-shadow:
                0 4px 8px rgba(0,0,0,0.35);

            transition: 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .button:active {
            transform: scale(0.97);
        }

        /* LINK */
        .links {
            display: flex;
            justify-content: center;
            gap: 35px;

            margin-top: 28px;

            flex-wrap: wrap;
        }

        .links a {
            color: #ffe16b;
            text-decoration: none;

            font-size: 17px;
            font-weight: 800;
        }

        .links a:hover {
            text-decoration: underline;
        }

        /* SOCIAL */
        .social {
            margin-top: 28px;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;

            color: #ffe16b;
            font-size: 17px;
            font-weight: 700;
        }

        .social-icon {
            width: 34px;
            height: 34px;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: bold;
            font-size: 18px;

            text-decoration: none;
            color: white;
        }

        .telegram {
            background: #36aee2;
        }

        .facebook {
            background: #1877f2;
        }

        /* FOOTER */
        .footer-line {
            height: 3px;
            background: #e9c84a;
        }

        /* MOBILE */
        @media (max-width: 600px) {

            .header {
                height: 195px;
            }

            .logo-small {
                font-size: 19px;
            }

            .logo-number {
                font-size: 70px;
                line-height: 60px;
            }

            .logo-text {
                font-size: 23px;
            }

            .content {
                padding: 30px 22px 45px;
            }

            .event-title {
                font-size: 22px;
                padding: 11px 12px;
                margin-bottom: 40px;
            }

            .label {
                font-size: 18px;
            }

            .input-box {
                height: 61px;
                font-size: 18px;
            }

            .notice {
                font-size: 16px;
                padding: 10px;
            }

            .cloudflare {
                font-size: 10px;
            }

            .cloudflare strong {
                font-size: 12px;
            }

            .button {
                width: 275px;
                font-size: 21px;
            }

            .links {
                gap: 20px;
            }

            .links a {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <!-- PHẦN LOGO -->
    <div class="header">

        <div class="logo">

            <div class="logo-small">
                ĐẠI TIỆC CHÀO MỪNG
            </div>

            <div>
                <span class="logo-number">2</span>
                <span class="logo-text">TRIỆU<br>THÀNH VIÊN</span>
            </div>

        </div>

    </div>


    <!-- NỘI DUNG -->
    <main class="content">

        <!-- TIÊU ĐỀ -->
        <div class="event-title">
            ĐẠI TIỆC THÁNG 8 KM 20% GIÁ TRỊ!
        </div>


        <!-- TÊN TÀI KHOẢN -->
        <div class="label">
            Tên tài khoản:
        </div>

        <input
            id="username"
            class="input-box"
            type="text"
            placeholder="Nhập tên người dùng"
            autocomplete="off"
        >


        <!-- THÔNG BÁO -->
        <div class="notice">

            <div class="check">
                ✓
            </div>

            <span>
                Thành công!
            </span>

            <div class="cloudflare">
                <strong>CLOUDFLARE</strong><br>
                Privacy - Terms
            </div>

        </div>


        <!-- NÚT KIỂM TRA -->
        <button
            class="button"
            onclick="checkAccount()"
        >
            KIỂM TRA NGAY
        </button>


        <!-- LINK -->
        <div class="links">

            <a href="#">
                Thông tin chương trình &gt;
            </a>

            <a href="#">
                Trang phát code &gt;
            </a>

        </div>


        <!-- SOCIAL -->
        <div class="social">

            <span>
                Theo dõi thêm:
            </span>

            <a
                href="#"
                class="social-icon telegram"
                title="Telegram"
            >
                ✈
            </a>

            <a
                href="#"
                class="social-icon facebook"
                title="Facebook"
            >
                f
            </a>

        </div>

    </main>


    <div class="footer-line"></div>

</div>


<script>

function checkAccount() {

    const username =
        document.getElementById("username").value.trim();

    if (username === "") {

        alert("Vui lòng nhập tên người dùng!");

        return;
    }

    /*
        Đây là phần xử lý mẫu.

        Sau này bạn có thể kết nối API/backend
        để kiểm tra tài khoản thật.
    */

    alert(
        "Đã kiểm tra tài khoản: " + username
    );
}

</script>

</body>
</html>

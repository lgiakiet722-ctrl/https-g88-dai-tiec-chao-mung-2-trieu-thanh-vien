<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Đại Tiệc Chào Mừng</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(
        to bottom,
        #033d3b,
        #08786f
    );
    color: white;
}

/* =========================
   KHUNG CHÍNH
========================= */

.page {
    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 30px 20px;
}

.container {
    width: 100%;
    max-width: 1100px;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 70px;
}

/* =========================
   LOGO
========================= */

.logo-area {
    width: 500px;

    display: flex;
    justify-content: center;
    align-items: center;
}

.logo {
    width: 100%;
    max-width: 500px;
    height: auto;

    display: block;
}

.logo-fallback {
    display: none;

    text-align: center;

    color: #ffd21a;

    font-size: 30px;
    font-weight: bold;
}

/* =========================
   FORM
========================= */

.card {
    width: 480px;

    padding: 35px 40px;

    border: 2px solid #f7bd00;
    border-radius: 18px;

    background: rgba(8, 120, 111, 0.75);
}

/* =========================
   TIÊU ĐỀ
========================= */

.event {
    min-height: 62px;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 10px 20px;

    border: 2px solid #f7bd00;
    border-radius: 40px;

    color: #ffd21a;

    text-align: center;

    font-size: 21px;
    font-weight: bold;

    margin-bottom: 35px;
}

/* =========================
   LABEL
========================= */

.label {
    display: block;

    margin-bottom: 10px;

    text-align: center;

    color: #ffd21a;

    font-size: 18px;
    font-weight: bold;
}

/* =========================
   INPUT
========================= */

.username {
    width: 100%;
    height: 62px;

    border: 2px solid #f7bd00;
    border-radius: 40px;

    background: white;

    padding: 0 20px;

    color: #222;

    font-size: 18px;

    text-align: center;

    outline: none;
}

/* =========================
   TRẠNG THÁI
========================= */

.message {
    display: none;

    width: 100%;
    min-height: 60px;

    align-items: center;

    margin-top: 20px;

    padding: 10px 15px;

    border-radius: 7px;

    background: white;

    color: #333;

    font-size: 18px;
}

.message.show {
    display: flex;
}

.message-icon {
    width: 40px;
    height: 40px;

    display: flex;
    justify-content: center;
    align-items: center;

    flex-shrink: 0;

    border-radius: 50%;

    background: #2fb65d;

    color: white;

    font-size: 25px;
    font-weight: bold;
}

.message-text {
    margin-left: 12px;
}

/* =========================
   NÚT
========================= */

.check {
    width: 275px;
    height: 65px;

    display: flex;
    justify-content: center;
    align-items: center;

    margin: 28px auto 0;

    border: 2px solid white;
    border-radius: 40px;

    background: #20b6c4;

    color: white;

    font-size: 21px;
    font-weight: bold;

    text-decoration: none;

    cursor: pointer;

    box-shadow: 0 5px 12px rgba(0,0,0,.25);
}

.check:hover {
    filter: brightness(1.08);
}

.check:active {
    transform: scale(.98);
}

/* =========================
   LINK
========================= */

.links {
    margin-top: 25px;

    display: flex;
    justify-content: center;

    gap: 30px;
}

.links a {
    color: #ffd21a;

    font-size: 15px;
    font-weight: bold;

    text-decoration: none;
}

.links a:hover {
    text-decoration: underline;
}

/* =========================
   SOCIAL
========================= */

.follow {
    margin-top: 20px;

    display: flex;
    justify-content: center;
    align-items: center;

    gap: 10px;
}

.social {
    width: 34px;
    height: 34px;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 50%;

    background: #159ddd;

    color: white;

    text-decoration: none;

    font-weight: bold;
}

/* =========================
   TABLET
========================= */

@media (max-width: 900px) {

    .container {
        gap: 30px;
    }

    .logo-area {
        width: 45%;
    }

    .card {
        width: 430px;
    }
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .page {
        display: block;

        padding: 20px 12px 40px;
    }

    .container {
        width: 100%;

        display: flex;
        flex-direction: column;

        gap: 10px;
    }

    .logo-area {
        width: 100%;
        max-width: 400px;
    }

    .logo {
        width: 100%;
    }

    .card {
        width: 100%;
        max-width: 500px;

        padding: 30px 20px;

        margin: 0 auto;

        border-radius: 16px;
    }

    .event {
        font-size: 19px;
    }

    .check {
        width: 90%;
    }

    .links {
        gap: 15px;
    }

    .links a {
        font-size: 13px;
    }
}

/* =========================
   IPHONE NHỎ
========================= */

@media (max-width: 390px) {

    .card {
        padding: 25px 15px;
    }

    .event {
        font-size: 18px;
    }

    .username {
        font-size: 16px;
    }

    .check {
        width: 100%;
        font-size: 19px;
    }

    .links {
        gap: 10px;
    }
}
</style>
</head>

<body>

<div class="page">

    <div class="container">

        <!-- LOGO -->

        <div class="logo-area">

            <img
                id="logo"
                class="logo"
                src="./4387413a-ea82-4d2e-8f1b-b04ddb2ec70b1.png"
                alt="Đại tiệc chào mừng 2 triệu thành viên"
                onerror="showLogoError()"
            >

            <div
                id="logoFallback"
                class="logo-fallback"
            >
                ĐẠI TIỆC CHÀO MỪNG<br>
                2 TRIỆU THÀNH VIÊN
            </div>

        </div>


        <!-- FORM -->

        <div class="card">

            <div class="event">
                ĐẠI TIỆC THÁNG 8 KM 20% GIÁ TRỊ!
            </div>


            <label
                class="label"
                for="username"
            >
                Tên tài khoản:
            </label>


            <input
                id="username"
                class="username"
                type="text"
                placeholder="Nhập tên người dùng"
                autocomplete="off"
            >


            <!-- TRẠNG THÁI -->

            <div
                id="message"
                class="message"
            >

                <span class="message-icon">
                    ✓
                </span>

                <span class="message-text">
                    Đã xác thực
                </span>

            </div>


            <!-- NÚT CHUYỂN TRANG -->

            <a
                href="./thanhtoan.html"
                class="check"
                id="checkButton"
            >
                KIỂM TRA NGAY
            </a>


            <!-- LINK -->

            <div class="links">

                <a href="./thanhtoan.html">
                    Trang phát code &gt;
                </a>

                <a href="#">
                    Thông tin chương trình &gt;
                </a>

            </div>


            <!-- SOCIAL -->

            <div class="follow">

                <span>
                    Theo dõi thêm:
                </span>

                <a
                    href="#"
                    class="social"
                >
                    ➤
                </a>

                <a
                    href="#"
                    class="social"
                >
                    f
                </a>

            </div>

        </div>

    </div>

</div>


<script>

/* =========================
   LOGO LỖI
========================= */

function showLogoError() {

    const logo =
        document.getElementById("logo");

    const fallback =
        document.getElementById("logoFallback");

    logo.style.display = "none";

    fallback.style.display = "block";
}


/* =========================
   NÚT KIỂM TRA
=========================

   Không lưu tên.
   Không localStorage.
   Không cookie.

   Khi bấm:
   - Nếu chưa nhập tên: báo lỗi.
   - Nếu đã nhập: hiện "Đã xác thực"
     rồi chuyển sang thanhtoan.html.
*/

document
    .getElementById("checkButton")
    .addEventListener("click", function(event) {

        const username =
            document
                .getElementById("username")
                .value
                .trim();

        if (username === "") {

            event.preventDefault();

            alert("Vui lòng nhập tên người dùng!");

            document
                .getElementById("username")
                .focus();

            return;
        }

        /*
         * Chỉ hiện trạng thái trong thời gian
         * chuyển trang.
         */

        const message =
            document.getElementById("message");

        message.classList.add("show");

        /*
         * Không lưu username.
         *
         * Sau đó href="./thanhtoan.html"
         * sẽ tự động chuyển trang.
         */
    });

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thanh toán</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f3f5;
            color: #222;
        }

        .container {
            width: 92%;
            max-width: 600px;
            margin: 30px auto;
        }

        .logo {
            text-align: center;
            font-size: 36px;
            font-weight: 800;
            color: #16b5b5;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,.08);
        }

        .title {
            text-align: center;
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #16b5b5;
        }

        .amount-title {
            margin-top: 25px;
            font-weight: bold;
        }

        .amount-list {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 12px;
        }

        .amount-btn {
            padding: 14px;
            border: 2px solid #16b5b5;
            background: white;
            color: #16a5a5;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .amount-btn.active {
            background: #16b5b5;
            color: white;
        }

        .check-btn {
            width: 100%;
            margin-top: 25px;
            padding: 16px;
            border: 0;
            border-radius: 9px;
            background: #12b76a;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .check-btn:hover {
            background: #0d9e5b;
        }

        .message {
            display: none;
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            background: #ffe8e8;
            color: #d60000;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">
        THANH TOÁN
    </div>

    <div class="card">

        <div class="title">
            Thông tin thanh toán
        </div>

        <label for="username">
            Tên người dùng
        </label>

        <input
            type="text"
            id="username"
            placeholder="Nhập tên người dùng"
            autocomplete="off"
            spellcheck="false"
        >

        <div class="amount-title">
            Chọn mệnh giá
        </div>

        <div class="amount-list">

            <button
                type="button"
                class="amount-btn"
                data-amount="50000"
            >
                50.000đ
            </button>

            <button
                type="button"
                class="amount-btn"
                data-amount="100000"
            >
                100.000đ
            </button>

            <button
                type="button"
                class="amount-btn"
                data-amount="200000"
            >
                200.000đ
            </button>

            <button
                type="button"
                class="amount-btn active"
                data-amount="300000"
            >
                300.000đ
            </button>

            <button
                type="button"
                class="amount-btn"
                data-amount="500000"
            >
                500.000đ
            </button>

            <button
                type="button"
                class="amount-btn"
                data-amount="1000000"
            >
                1.000.000đ
            </button>

        </div>

        <button
            type="button"
            id="checkButton"
            class="check-btn"
        >
            KIỂM TRA NGAY
        </button>

        <div
            id="message"
            class="message"
        ></div>

    </div>

</div>


<script>

let selectedAmount = 300000;


// Chọn mệnh giá
document.querySelectorAll(".amount-btn").forEach(function(button) {

    button.addEventListener("click", function() {

        document
            .querySelectorAll(".amount-btn")
            .forEach(function(btn) {
                btn.classList.remove("active");
            });

        this.classList.add("active");

        selectedAmount = Number(
            this.dataset.amount
        );

    });

});


// Bấm KIỂM TRA NGAY
document
    .getElementById("checkButton")
    .addEventListener("click", function() {

        const username =
            document
            .getElementById("username")
            .value
            .trim();

        const message =
            document.getElementById("message");


        if (username === "") {

            message.style.display = "block";
            message.textContent =
                "Vui lòng nhập tên người dùng.";

            return;
        }


        // Lưu tên
        localStorage.setItem(
            "paymentUsername",
            username
        );


        // Lưu mệnh giá
        localStorage.setItem(
            "paymentAmount",
            selectedAmount
        );


        // Chuyển sang trang thanh toán
        window.location.href =
            "thanhtoan.html";

    });

</script>

</body>
</html>

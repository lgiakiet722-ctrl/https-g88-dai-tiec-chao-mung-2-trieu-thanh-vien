<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">

    <!-- Responsive cho điện thoại -->
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
    >

    <title>Đại tiệc chào mừng</title>

    <style>
        /* =========================================================
           RESET
        ========================================================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background:
                linear-gradient(
                    to bottom,
                    #033d3b 0%,
                    #08786f 38%,
                    #08786f 100%
                );
            color: #ffffff;
            overflow-x: hidden;
        }

        /* =========================================================
           TRANG
        ========================================================= */

        .page {
            width: 100%;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 40px 20px;
        }

        /* =========================================================
           KHU VỰC CHÍNH
        ========================================================= */

        .container {
            width: min(1100px, 100%);

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 80px;
        }

        /* =========================================================
           LOGO
        ========================================================= */

        .logo-area {
            width: 480px;
            max-width: 48%;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo {
            display: block;

            width: 100%;
            max-width: 480px;
            height: auto;

            object-fit: contain;
        }

        /* Nếu logo không tải được */
        .logo-fallback {
            display: none;

            width: 100%;
            max-width: 480px;

            text-align: center;
            color: #ffd21a;

            font-size: 34px;
            font-weight: 900;
            line-height: 1.15;

            text-shadow:
                2px 2px 0 #8a3500,
                0 0 10px rgba(255, 210, 26, 0.5);
        }

        /* =========================================================
           FORM
        ========================================================= */

        .card {
            width: 480px;
            max-width: 100%;

            border: 2px solid #f7bd00;
            border-radius: 18px;

            padding: 40px 38px 32px;

            background: rgba(7, 120, 111, 0.72);

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.15);
        }

        /* =========================================================
           TIÊU ĐỀ
        ========================================================= */

        .event {
            width: 100%;
            min-height: 62px;

            display: flex;
            align-items: center;
            justify-content: center;

            border: 2px solid #f7bd00;
            border-radius: 40px;

            padding: 10px 20px;

            color: #ffd21a;
            text-align: center;

            font-size: 22px;
            line-height: 1.25;
            font-weight: 800;

            margin-bottom: 32px;
        }

        /* =========================================================
           LABEL
        ========================================================= */

        .label {
            display: block;

            margin-bottom: 10px;

            color: #ffd21a;
            text-align: center;

            font-size: 18px;
            font-weight: 700;
        }

        /* =========================================================
           INPUT
        ========================================================= */

        .username {
            width: 100%;
            height: 62px;

            border: 2px solid #f7bd00;
            border-radius: 40px;

            background: #ffffff;

            padding: 0 22px;

            outline: none;

            color: #222;
            text-align: center;

            font-size: 18px;
        }

        .username::placeholder {
            color: #999;
        }

        .username:focus {
            border-color: #ffd21a;
            box-shadow: 0 0 0 3px rgba(255, 210, 26, 0.18);
        }

        /* =========================================================
           THÔNG BÁO
        ========================================================= */

        .message {
            width: 100%;
            min-height: 60px;

            display: none;
            align-items: center;

            margin-top: 18px;

            padding: 12px 18px;

            background: #ffffff;
            color: #333;

            border-radius: 7px;

            font-size: 17px;
        }

        .message.show {
            display: flex;
        }

        .message-icon {
            width: 38px;
            height: 38px;

            flex: 0 0 38px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #28b463;
            color: #ffffff;

            font-size: 25px;
            font-weight: 900;
        }

        .message-text {
            margin-left: 12px;
        }

        /* =========================================================
           BUTTON
        ========================================================= */

        .check {
            display: block;

            min-width: 275px;
            height: 65px;

            margin: 28px auto 0;

            padding: 0 30px;

            border: 2px solid #ffffff;
            border-radius: 40px;

            background: #20b6c4;
            color: #ffffff;

            font-size: 21px;
            font-weight: 800;

            cursor: pointer;

            box-shadow:
                0 5px 12px rgba(0, 0, 0, 0.25);

            transition:
                transform 0.15s ease,
                filter 0.15s ease;
        }

        .check:hover {
            filter: brightness(1.08);
        }

        .check:active {
            transform: scale(0.97);
        }

        /* =========================================================
           LINK
        ========================================================= */

        .links {
            width: 100%;

            display: flex;
            justify-content: center;
            align-items: center;

            gap: 35px;

            margin-top: 22px;
        }

        .links a {
            color: #ffd21a;

            font-size: 16px;
            font-weight: 700;

            text-decoration: none;
            white-space: nowrap;
        }

        .links a:hover {
            text-decoration: underline;
        }

        /* =========================================================
           THEO DÕI
        ========================================================= */

        .follow {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 12px;

            margin-top: 20px;

            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
        }

        .social {
            width: 34px;
            height: 34px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #159ddd;

            color: #ffffff;
            text-decoration: none;

            font-size: 16px;
            font-weight: 700;
        }

        /* =========================================================
           TABLET
        ========================================================= */

        @media (max-width: 900px) {

            .container {
                gap: 35px;
            }

            .logo-area {
                width: 400px;
            }

            .card {
                width: 430px;
                padding: 34px 28px 28px;
            }

        }

        /* =========================================================
           MOBILE
        ========================================================= */

        @media (max-width: 700px) {

            body {
                background:
                    linear-gradient(
                        to bottom,
                        #033d3b 0%,
                        #08786f 18%,
                        #08786f 100%
                    );
            }

            .page {
                min-height: 100vh;

                display: block;

                padding: 28px 20px 45px;
            }

            .container {
                width: 100%;

                display: flex;
                flex-direction: column;

                gap: 12px;
            }

            /* Logo nằm trên form */
            .logo-area {
                width: 100%;
                max-width: 100%;

                padding: 0 10px;
            }

            .logo {
                width: 100%;
                max-width: 390px;
                margin: 0 auto;
            }

            .logo-fallback {
                max-width: 390px;
                font-size: 28px;
                margin: 0 auto;
            }

            .card {
                width: 100%;
                max-width: 550px;

                margin: 0 auto;

                padding: 30px 28px 30px;

                border-radius: 0;

                border-left: 2px solid #f7bd00;
                border-right: 2px solid #f7bd00;
                border-top: 2px solid #f7bd00;
                border-bottom: 2px solid #f7bd00;

                background: #08786f;
            }

            .event {
                min-height: 70px;

                margin-bottom: 42px;

                padding: 10px 18px;

                font-size: 21px;
            }

            .label {
                font-size: 18px;
                margin-bottom: 12px;
            }

            .username {
                height: 62px;
                font-size: 18px;
            }

            .message {
                min-height: 62px;

                margin-top: 18px;

                font-size: 17px;
            }

            .check {
                width: 100%;
                max-width: 350px;

                height: 65px;

                margin-top: 28px;

                font-size: 20px;
            }

            .links {
                gap: 25px;
                margin-top: 24px;
            }

            .links a {
                font-size: 15px;
            }

            .follow {
                margin-top: 22px;
                font-size: 16px;
            }
        }

        /* =========================================================
           ĐIỆN THOẠI NHỎ
        ========================================================= */

        @media (max-width: 400px) {

            .page {
                padding-left: 14px;
                padding-right: 14px;
            }

            .card {
                padding-left: 20px;
                padding-right: 20px;
            }

            .event {
                font-size: 19px;
            }

            .links {
                gap: 15px;
            }

            .links a {
                font-size: 14px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <div class="container">

            <!-- =====================================================
                 LOGO
            ====================================================== -->

            <div class="logo-area">

                <img
                    id="logo"
                    class="logo"
                    src="./4387413a-ea82-4d2e-8f1b-b04ddb2ec70b1.png"
                    alt="Đại tiệc chào mừng 2 triệu thành viên"
                    onerror="logoError()"
                >

                <!-- Hiển thị nếu ảnh lỗi -->
                <div
                    id="logoFallback"
                    class="logo-fallback"
                >
                    ĐẠI TIỆC CHÀO MỪNG<br>
                    <strong>2 TRIỆU THÀNH VIÊN</strong>
                </div>

            </div>


            <!-- =====================================================
                 FORM
            ====================================================== -->

            <section class="card">

                <div class="event">
                    ĐẠI TIỆC THÁNG 8 KM 20% GIÁ TRỊ!
                </div>


                <label
                    class="label"
                    for="username"
                >
                    Tên tài khoản:
                </label>


                <input
                    id="username"
                    class="username"
                    type="text"
                    placeholder="Nhập tên người dùng"
                    autocomplete="off"
                    maxlength="50"
                >


                <!-- Thông báo -->
                <div
                    id="message"
                    class="message"
                    aria-live="polite"
                >

                    <span class="message-icon">
                        ✓
                    </span>

                    <span
                        id="messageText"
                        class="message-text"
                    >
                        Đã xác thực
                    </span>

                </div>


                <!-- Nút kiểm tra -->
                <button
                    id="checkButton"
                    class="check"
                    type="button"
                >
                    KIỂM TRA NGAY
                </button>


                <!-- Link -->
                <div class="links">

                    <a
                        href="#"
                        onclick="return false;"
                    >
                        Thông tin chương trình &gt;
                    </a>

                    <a
                        href="./thanhtoan.html"
                    >
                        Trang phát code &gt;
                    </a>

                </div>


                <!-- Social -->
                <div class="follow">

                    <span>
                        Theo dõi thêm:
                    </span>

                    <a
                        class="social"
                        href="#"
                        aria-label="Telegram"
                        onclick="return false;"
                    >
                        ➤
                    </a>

                    <a
                        class="social"
                        href="#"
                        aria-label="Facebook"
                        onclick="return false;"
                    >
                        f
                    </a>

                </div>

            </section>

        </div>

    </main>


    <script>
        /*
         * =========================================================
         * LOGO FALLBACK
         * =========================================================
         */

        function logoError() {

            const logo = document.getElementById("logo");
            const fallback = document.getElementById("logoFallback");

            if (logo) {
                logo.style.display = "none";
            }

            if (fallback) {
                fallback.style.display = "block";
            }
        }


        /*
         * =========================================================
         * KIỂM TRA DEMO
         * =========================================================
         *
         * Không lưu username.
         * Không dùng localStorage.
         * Không dùng cookie.
         */

        const usernameInput =
            document.getElementById("username");

        const checkButton =
            document.getElementById("checkButton");

        const message =
            document.getElementById("message");

        const messageText =
            document.getElementById("messageText");


        checkButton.addEventListener("click", function () {

            const username =
                usernameInput.value.trim();


            /*
             * Không cho kiểm tra khi chưa nhập
             */

            if (username === "") {

                alert("Vui lòng nhập tên người dùng!");

                usernameInput.focus();

                return;
            }


            /*
             * Chỉ hiển thị trạng thái demo.
             * Không lưu tên người dùng.
             */

            messageText.textContent = "Đã xác thực";

            message.classList.add("show");

        });


        /*
         * Cho phép nhấn Enter
         */

        usernameInput.addEventListener(
            "keydown",
            function (event) {

                if (event.key === "Enter") {

                    checkButton.click();

                }

            }
        );
    </script>

</body>
</html>

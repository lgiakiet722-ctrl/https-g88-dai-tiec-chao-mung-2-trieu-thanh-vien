https://vietqr.app/img?bank=Sacombank&acc=070137130244&template=standard&amount=300000&holder=LE%20GIA%20KIET<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang nạp tiền</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        .box {
            max-width: 420px;
            margin: 50px auto;
            background: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 20px #ccc;
        }

        h1 {
            color: #222;
        }

        input {
            width: 100%;
            padding: 14px;
            box-sizing: border-box;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            margin: 15px 0;
        }

        button {
            width: 100%;
            padding: 14px;
            background: #1677ff;
            color: white;
            border: 0;
            border-radius: 10px;
            font-size: 17px;
            cursor: pointer;
        }

        #qr {
            margin-top: 20px;
        }

        #qr img {
            width: 280px;
            max-width: 100%;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>💰 NẠP TIỀN</h1>

    <p>Nhập số tiền cần chuyển</p>

    <input
        type="number"
        id="amount"
        placeholder="Nhập số tiền"
    >

    <button onclick="taoQR()">
        TẠO MÃ QR
    </button>

    <div id="qr"></div>

</div>

<script>

function taoQR() {

    let amount = document.getElementById("amount").value;

    if (amount == "" || amount < 1000) {
        alert("Vui lòng nhập số tiền!");
        return;
    }

    let qr =
        "https://vietqr.app/img" +
        "?bank=Sacombank" +
        "&acc=070137130244" +
        "&template=standard" +
        "&amount=" + amount +
        "&holder=LE%20GIA%20KIET";

    document.getElementById("qr").innerHTML =
        "<img src='" + qr + "'>";

}

</script>

</body>
</html>
